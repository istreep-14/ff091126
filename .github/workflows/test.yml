name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # `node --test` and the fetch/AbortSignal.timeout this code relies on
          # are all built in from 20; 22 is what it is developed against.
          node-version: '22'
      # No `npm ci`: there is no dependency to install and no lockfile to
      # install it from. That is deliberate, and CI should not imply otherwise.
      - run: npm test

      # The tests cover the pure logic. This covers the thing that actually
      # breaks a release: a syntax error in the 3,000-line browser bundle,
      # which nothing on the Node side would ever execute.
      - name: dashboard template parses
        run: |
          node -e '
            const {readFileSync, writeFileSync} = require("node:fs");
            const html = readFileSync("src/dashboard.template.html", "utf8");
            const blocks = [...html.matchAll(/<script(?![^>]*type=)[^>]*>([\s\S]*?)<\/script>/g)];
            if (!blocks.length) throw new Error("no inline script found in the template");
            blocks.forEach((m, i) => writeFileSync(`/tmp/block${i}.js`, m[1]));
            console.log(`${blocks.length} inline script block(s) extracted`);
          '
          for f in /tmp/block*.js; do node --check "$f"; done
