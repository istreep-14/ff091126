function pageStandings(){
  const l=L(), out=[];
  const h=el('div','head'); h.append(el('h1',null,'Standings'));
  h.append(el('p',null,leagueLabel(l)+' · '+l.host+' · '+l.teams.length+' teams'));
  out.push(h);

  const rows=standingsRows(l);
  const divisions=[...new Set(rows.map(r=>r.division).filter(Boolean))].sort();
  const anyPf=rows.some(r=>r.pointsFor!=null);
  const anyOdds=rows.some(r=>r.oddsPct!=null);
  const anyWaiver=rows.some(r=>r.waiverPosition!=null || r.waiverBudgetUsed!=null);
  const anyWeek=rows.some(r=>r.wkResult);
  const anySeed=rows.some(r=>r.seed!=null);
  const anyProvisional=rows.some(r=>r.provisional);

  if(divisions.length>1){
    const bar=el('div','toggles');
    bar.append(segmented([{label:'Whole league',value:'all'},{label:'By division',value:'division'}], standView,
      v=>{ standView=v; store.set('gd.standView',v); writeHash(); render(); }));
    out.push(bar);
  }

  const cutIndex = anySeed ? rows.filter(r=>r.inPlayoffs).length : (l.playoffs&&l.playoffs.teams) || null;
  const budget = l.faabBudget ?? (l.detail&&l.detail.supported? l.detail.settings.waiverBudget : null);

  // Every column carries a width, including the name. Under fixed layout the
  // leftover is then shared out proportionally; leaving the name column
  // unsized handed it every spare pixel and crushed the numbers against the
  // right edge.
  const cols=[
    {key:'rank',   label:'#',       r:1, w:44},
    {key:'name',   label:'Team',    w:230},
    {key:'record', label:'Record',  r:1, w:74, title:'Includes this week’s result once it is decided'},
    {key:'gb',     label:'GB',      r:1, w:44, title:'Games back of the leader'},
  ];
  if(anyWeek) cols.push({key:'week', label:'Week '+DATA.week, r:1, w:78, title:'This week’s score and result'});
  if(anyPf) cols.push({key:'pf', label:'PF', r:1, w:70},{key:'pa', label:'PA', r:1, w:70});
  if(divisions.length && standView!=='division') cols.push({key:'div', label:'Division', w:92});
  if(anyOdds) cols.push({key:'odds', label:'Playoff %', r:1, w:74, title:'MyPlaybook projected playoff odds'});
  if(anyWaiver) cols.push({key:'waiver', label:'Waiver', r:1, w:72, title:budget? 'Claim order, and FAAB remaining' : 'Claim order'});

  // Seed order is the right default the moment a rule exists: it is the only
  // ordering that answers "who is in", and it already includes this week.
  if(!store.get('gd.standSort','') && anySeed) standSort='rank';

  const onSort=(k)=>{
    if(standSort===k) standFlip=!standFlip; else { standSort=k; standFlip=false; }
    store.set('gd.standSort',standSort); store.set('gd.standFlip',standFlip?'1':'');
    writeHash(); render();
  };

  const buildRow=(r, idx, showCut)=>{
    const tr=el('tr');
    if(r.mine) tr.classList.add('mine');
    // In vs out is a fill, not just a line: sorting by points-for or by
    // division breaks rank order, and a divider drawn at a fixed row index
    // would then sit in the wrong place while still looking authoritative.
    if(r.inPlayoffs===true) tr.classList.add('inplay');
    else if(r.inPlayoffs===false) tr.classList.add('outplay');
    if(showCut) tr.classList.add('cutline');

    const rk=el('td','r');
    // The number is this table's OWN position under the current sort. Showing
    // the host's rank here was the inconsistency: it excludes the week in
    // progress, so #1 sat above a team with the same record and more points
    // while the screen showed both of them winning.
    const badge=el('span','seedno'+(r.inPlayoffs?' in':''), r.seed!=null? String(r.seed) : String(idx+1));
    badge.title = r.seedWhy? ('Seed '+r.seed+' — '+r.seedWhy)
      : (r.rank!=null? 'Host has them #'+r.rank+' (excludes this week)' : '');
    rk.append(badge); tr.append(rk);

    tr.append(teamCell(r));

    const rec=el('td','r');
    const rd=el('div','stack');
    const rv=el('div','sv'+(r.provisional?' prov':''));
    rv.textContent=r.effWins+'-'+r.effLosses+(r.effTies?'-'+r.effTies:'');
    rd.append(rv);
    if(r.provisional) rd.append(Object.assign(el('div','ss'),{textContent:r.wins+'-'+r.losses+' official'}));
    rec.append(rd);
    if(r.provisional) rec.title='Includes this week as it currently stands. Official record is '+r.wins+'-'+r.losses+'.';
    tr.append(rec);

    tr.append(Object.assign(el('td','r num'),{textContent: r.gb===0? '—' : (Number.isInteger(r.gb)? String(r.gb) : r.gb.toFixed(1))}));

    if(anyWeek) tr.append(weekCell(r));
    if(anyPf){
      tr.append(Object.assign(el('td','r num'),{textContent:r.pointsFor==null?'—':num(r.pointsFor)}));
      tr.append(Object.assign(el('td','r num'),{textContent:r.pointsAgainst==null?'—':num(r.pointsAgainst)}));
    }
    if(divisions.length && standView!=='division'){
      const dv=el('td');
      if(r.division) dv.append(el('span','pill gh', r.division));
      else dv.append(el('span','note','—'));
      tr.append(dv);
    }
    if(anyOdds){
      const od=el('td','r');
      if(r.oddsPct==null) od.append(el('span','note','—'));
      else{
        const sp=el('span','num odds');
        sp.textContent=r.oddsPct+'%';
        sp.style.color = r.oddsPct>=70? 'var(--good)' : (r.oddsPct>=35? 'var(--market)' : 'var(--bad)');
        od.append(sp);
      }
      if(r.projRecord) od.title='Projected finish '+r.projRecord[0]+'-'+r.projRecord[1]+' (#'+(r.rankProj??'—')+')';
      tr.append(od);
    }
    if(anyWaiver){
      const wv=el('td','r');
      const d=el('div','stack');
      d.append(Object.assign(el('div','sv'),{textContent: r.waiverPosition==null? '—' : '#'+r.waiverPosition}));
      if(r.waiverBudgetUsed!=null && budget) d.append(Object.assign(el('div','ss'),{textContent:'$'+(budget-r.waiverBudgetUsed)}));
      else if(r.totalMoves!=null) d.append(Object.assign(el('div','ss'),{textContent:r.totalMoves+' mv'}));
      wv.append(d); tr.append(wv);
    }
    return tr;
  };

  if(standView==='division' && divisions.length>1){
    divisions.forEach(dv=>{
      const sub=sortRows(rows.filter(r=>r.division===dv), standSort, standFlip);
      out.push(panel(dv, sub.length+' teams', sortableTable(cols, sub.map((r,i)=>buildRow(r,i,false)), {sortKey:standSort, flip:standFlip, onSort})));
    });
    const none=rows.filter(r=>!r.division);
    if(none.length){
      const sub=sortRows(none, standSort, standFlip);
      out.push(panel('No division', none.length+' teams · assign them in League Setup',
        sortableTable(cols, sub.map((r,i)=>buildRow(r,i,false)), {sortKey:standSort, flip:standFlip, onSort})));
    }
  } else {
    const sorted=sortRows(rows, standSort, standFlip);
    // The cut line is only drawn when the current sort still puts the qualifying
    // teams on top; under any other sort the fill carries it instead.
    const rankOrdered = (standSort==='rank' || standSort==='record') && !standFlip;
    const trs=[];
    sorted.forEach((r,i)=>{
      if(rankOrdered && cutIndex!=null && i===cutIndex){
        // A labelled divider, not a hairline: "the playoff cut is here" is the
        // single most-read fact on this page and a 2px border does not say it.
        const cut=el('tr','cutrow');
        const td=el('td'); td.colSpan=cols.length;
        td.append(el('span',null,'playoff cut \u00b7 top '+cutIndex+(anySeed?' by this league\u2019s rule':'')));
        cut.append(td); trs.push(cut);
      }
      trs.push(buildRow(r,i,false));
    });
    out.push(panel('Standings', standingsSource(l, rows), sortableTable(cols, trs, {sortKey:standSort, flip:standFlip, onSort})));
  }

  const notes=[];
  if(anySeed) notes.push('Shaded rows are in the playoffs under this league’s own rule — '+(l.seedRule.describe||''));
  else if(cutIndex) notes.push('Top '+cutIndex+' make the playoffs. Set a seeding rule in League Setup to mark them under your league’s actual rule.');
  if(anyProvisional) notes.push('Records include this week as it currently stands; the official record is on the tooltip.');
  if(!anyPf) notes.push('Points for and against appear once a week is fully final — counting a half-finished week would put a number on some teams and nothing on the rest, in the same sorted table.');
  else if(rows.some(r=>r.pfSource==='ledger')) notes.push('Points accumulated from '+( (l.completeWeeks||[]).length )+' completed week(s) this app has stored; neither ESPN nor Yahoo publishes a season total anywhere reachable.');
  notes.forEach(n=> out.push(Object.assign(el('p','note'),{textContent:n})));

  const P=l.adv&&l.adv.standings;
  if(P && !P.ok && P.inactive) out.push(inactiveNote(l,'Projected standings'));
  return out;
}

function standingsSource(l, rows){
  const bits=[];
  if(rows.some(r=>r.rank!=null)) bits.push('records from MyPlaybook');
  if(rows.some(r=>r.wkResult)) bits.push('live scores from all '+l.teams.length+' teams');
  if(rows.some(r=>r.pointsFor!=null)) bits.push('points from '+(rows.some(r=>r.pfSource==='ledger')? (l.completeWeeks||[]).length+' complete week(s)' : l.host));
  if(rows.some(r=>r.waiverPosition!=null)) bits.push('waivers from '+l.host);
  return bits.join(' · ') || l.host;
}

/* ---------- waiver clock ----------
 *
 * "Is he a free agent or a waiver claim?" is a different question from "is he
 * unrostered", and it changes what you do: a free agent is first-come, a
 * waiver player costs a claim and processes on a schedule.
 *
 * No host exposes a per-player waiver state through anything reachable here.
 * It is derivable, though, from two things we do have: the drop that put him
 * there (transactions carry the date, and `viaWaivers` on the URL), and the
 * league's own claim period and process day, which you set in League Setup.
 *
 * When the period is not configured this returns null rather than guessing —
 * an invented clear time would be read as fact.
 */
const DAY_MS = 86400000;

function waiverClock(l){
  const o = ovFor(l);
  const w = o.waivers || {};
  const days = w.claimDays;
  const type = (w.type || l.waiverType || '').toLowerCase();
  if (type === 'none') return { configured:true, none:true, byPlayer:new Map() };
  if (days == null && w.processDay == null) return { configured:false, byPlayer:new Map() };

  // Most recent drop per player, across the whole league.
  const dropped = new Map();
  for (const t of l.transactions || []) {
    for (const d of t.drops || []) {
      const at = t.time ? new Date(t.time) : (t.date ? new Date(t.date) : null);
      if (!at || Number.isNaN(at.getTime())) continue;
      const prev = dropped.get(d.fpId);
      if (!prev || at > prev.at) dropped.set(d.fpId, { at, teamName: t.teamName });
    }
  }

  const now = new Date();
  const byPlayer = new Map();
  for (const [fpId, rec] of dropped) {
    let clearsAt = null;
    if (days != null) clearsAt = new Date(rec.at.getTime() + days * DAY_MS);
    if (w.processDay != null) {
      // Claims process on a fixed weekday; a player sits until the first
      // processing run at or after his claim period ends.
      const from = clearsAt || rec.at;
      const c = new Date(from);
      c.setHours(w.processHour ?? 3, 0, 0, 0);
      while (c.getDay() !== w.processDay || c < from) c.setDate(c.getDate() + 1);
      clearsAt = c;
    }
    if (!clearsAt) continue;
    byPlayer.set(fpId, {
      droppedAt: rec.at, droppedBy: rec.teamName, clearsAt,
      onWaivers: now < clearsAt,
      hoursLeft: Math.max(0, (clearsAt - now) / 3600000),
    });
  }
  return { configured:true, none:false, type, byPlayer };
}

/** "on waivers · clears Wed 3am" / "free agent". */
function waiverCell(clock, p){
  const td = el('td');
  if (!clock.configured) { td.append(el('span','note','—')); td.title='Set a claim period in League Setup to see this.'; return td; }
  if (clock.none) { td.append(el('span','pill ok','free agent')); return td; }
  const w = clock.byPlayer.get(p.i);
  if (!w || !w.onWaivers) { td.append(el('span','pill ok','free agent')); return td; }
  const box = el('div','mvside');
  box.append(el('span','pill q','on waivers'));
  const hrs = w.hoursLeft;
  const when = hrs < 24
    ? 'clears in ' + Math.round(hrs) + 'h'
    : 'clears ' + w.clearsAt.toLocaleDateString([], {weekday:'short'}) + ' ' +
      w.clearsAt.toLocaleTimeString([], {hour:'numeric'});
  box.append(Object.assign(el('div','ss'),{textContent:when}));
  td.append(box);
  td.title = 'Dropped ' + w.droppedAt.toLocaleString() + (w.droppedBy ? ' by ' + w.droppedBy : '') +
    '; claims process before he reaches free agency.';
  return td;
}

/* ---------- demand signal ----------
   Everything else in this dashboard answers "how many points". This answers
   "how long is the window open", which is the question a waiver claim actually
   turns on — and it is the only data here that moves by the hour. */

/** Adds per hour, abbreviated: 16428 -> 16.4k/h. */
function rate(v){
  if(v==null) return '—';
  if(v>=10000) return (v/1000).toFixed(0)+'k';
  if(v>=1000) return (v/1000).toFixed(1)+'k';
  return String(Math.round(v));
}
function bigNum(v){
  if(v==null) return '—';
  if(v>=100000) return (v/1000).toFixed(0)+'k';
  if(v>=1000) return (v/1000).toFixed(1)+'k';
  return String(v);
}

/**
 * The acceleration cell, which is the one number on this page worth acting on.
 *
 * Volume tells you a player has already been claimed; acceleration tells you he
 * is being claimed NOW. Michael Mayer at 380k adds and 0.33x is a wave that
 * broke hours ago and a claim you are late to; Devin Singletary at 100k and
 * 200x is the wave itself.
 */
function surgeCell(sig){
  const td=el('td','r');
  if(!sig){ td.append(el('span','delta flat','—')); return td; }
  if(sig.v==null){
    const sp=el('span','pill '+(sig.fresh?'ok':'gh'), sig.r!=null?'new':'—');
    sp.title = sig.fresh? 'No measurable activity before the last few hours — this is the start of the wave.' : 'Not enough history to measure a rate.';
    td.append(sp); return td;
  }
  const cls = sig.v>=2 ? 'up' : (sig.v<0.7 ? 'dn' : 'flat');
  const sp=el('span','delta '+cls, sig.v>=10? Math.round(sig.v)+'x' : sig.v.toFixed(1)+'x');
  sp.title = 'Adds per hour over the last '+(DATA.signals.windows?DATA.signals.windows[0]:6)+'h against the rate before it. '+
    (sig.v>=2? 'Accelerating — claim now.' : (sig.v<0.7? 'Decelerating — the wave has passed.' : 'Steady.'));
  td.append(sp); return td;
}

/** Yahoo's day count, with the change against the day before it. */
function buzzCell(sig, side){
  const td=el('td','r');
  const v = side==='drop' ? sig && sig.yd : sig && sig.ya;
  if(v==null){ td.append(el('span','delta flat','—')); return td; }
  const d=el('div','stack');
  d.append(Object.assign(el('div','sv'),{textContent:bigNum(v)}));
  // Only a CHANGE goes on the second line. A literal "0" under the count read
  // as a value in its own right when it means "we have yesterday and it moved
  // not at all", which is the one case worth saying nothing about.
  if(side!=='drop' && sig.yc) d.append(Object.assign(el('div','ss'),{textContent:(sig.yc>0?'+':'\u2212')+bigNum(Math.abs(sig.yc))}));
  td.append(d);
  td.title='On '+(sig.dt||'—')+': '+bigNum(sig.ya)+' Yahoo adds, '+bigNum(sig.yd)+' drops'+
    (sig.yc!=null?'; adds changed '+(sig.yc>0?'+':'')+bigNum(sig.yc)+' vs the previous day':'');
  return td;
}

/** Net adds minus drops across Yahoo. Negative is the whole point of a drop board. */
function netCell(sig){
  const td=el('td','r');
  if(!sig || sig.yn==null){ td.append(el('span','delta flat','—')); return td; }
  td.append(el('span','delta '+(sig.yn>0?'up':(sig.yn<0?'dn':'flat')), (sig.yn>0?'+':'\u2212')+bigNum(Math.abs(sig.yn))));
  td.title='Yahoo adds minus drops for the day.';
  return td;
}

/** How much of the market already has him — the size of the window remaining. */
function rosteredCell(sig){
  const td=el('td','r');
  if(!sig || sig.yr==null){ td.append(el('span','delta flat','—')); return td; }
  const box=el('div'); box.style.display='flex'; box.style.alignItems='center'; box.style.gap='7px'; box.style.justifyContent='flex-end';
  box.append(Object.assign(el('span','num'),{textContent:sig.yr+'%'}));
  const bar=el('div','bar'); const i=el('i');
  i.style.width=Math.max(0,Math.min(100,sig.yr))+'%';
  if(sig.yrc!=null && sig.yrc>0) i.className='mk';
  bar.append(i); box.append(bar);
  td.append(box);
  td.title=sig.yr+'% of Yahoo leagues roster him'+(sig.yrc!=null?' ('+(sig.yrc>0?'+':'')+sig.yrc+' pts since the previous day)':'')+
    (sig.ys!=null?'; started in '+sig.ys+'%':'');
  return td;
}

const SIG_SORTS = {
  surge:  {label:'Rising now', of:(p)=> p.sig && p.sig.v!=null ? p.sig.v : -1,
           note:'sorted by how much the add rate has accelerated in the last few hours'},
  rate:   {label:'Adds/hour',  of:(p)=> p.sig?.r ?? -1,
           note:'sorted by Sleeper adds per hour right now'},
  volume: {label:'Most added', of:(p)=> Math.max(p.sig?.a ?? 0, p.sig?.ya ?? 0),
           note:'sorted by total adds — who the market has already taken'},
  proj:   {label:'Projection', of:(p)=> p.wk ?? -1,
           note:'sorted by this week\u2019s consensus projection'},
};

/**
 * The signal table, in add or drop orientation.
 *
 * The two boards are not the same table with a different filter. Sleeper only
 * publishes an ADD rate, so surge and adds/hour are blank for every dropped
 * player and would be two dead columns; and a drop board that leads with adds
 * shows the smaller of the two numbers it exists to report. Drop mode swaps
 * both for the counts that are actually moving.
 */
function signalTable(list, opts){
  const o = opts || {};
  const drop = o.side==='drop';
  const rows=list.map(p=>{
    const tr=el('tr');
    tr.append(playerCell2(p));
    if(o.clock) tr.append(waiverCell(o.clock,p));
    if(drop){
      tr.append(netCell(p.sig));
    } else {
      tr.append(surgeCell(p.sig));
      const r=el('td','r num'); r.textContent = p.sig?.r!=null ? rate(p.sig.r) : '—';
      if(p.sig?.r!=null) r.title = Math.round(p.sig.r)+' adds per hour across Sleeper';
      tr.append(r);
    }
    tr.append(buzzCell(p.sig, o.side));
    tr.append(rosteredCell(p.sig));
    tr.append(stackCell(fmt(p.wk), null, {sep:1}));
    tr.append(stackCell(fmt(p.ros,0), null));
    if(o.note){
      const n=el('td','note'); n.style.whiteSpace='nowrap'; n.style.fontSize='11px';
      n.textContent = p.sig?.nt || ''; tr.append(n);
    }
    return tr;
  });
  const cols=[{label:'Player'}];
  if(o.clock) cols.push({label:'Status',w:110});
  if(drop){
    cols.push({label:'Net',r:1,w:70,title:'Yahoo adds minus drops for the day'});
    cols.push({label:'Drops',r:1,w:70,title:'Yahoo drops for the day'});
  } else {
    cols.push({label:'Surge',r:1,w:62,title:'Recent add rate against the rate before it'});
    cols.push({label:'Adds/h',r:1,w:62,title:'Sleeper adds per hour, right now'});
    cols.push({label:'Yahoo',r:1,w:70,title:'Yahoo adds for the day, and the change against the day before'});
  }
  cols.push({label:'Rostered',r:1,w:108,title:'Share of Yahoo leagues already rostering him'});
  cols.push({label:'Wk',r:1,sep:1,w:PROJW,title:'FantasyPros week projection'});
  cols.push({label:'ROS',r:1,w:PROJW,title:'FantasyPros rest-of-season projection'});
  if(o.note) cols.push({label:'Last game',w:150});
  return table2(null, cols, rows);
}

function pageWaivers(){
  const l=L(), out=[];
  const h=el('div','head'); h.append(el('h1',null,'Waiver Wire'));
  h.append(el('p',null,'Unrostered in '+l.name+', ranked by how hard the rest of fantasy football is bidding for them. '+
    'Sleeper supplies a live add rate; Yahoo supplies a completed day of adds, drops and roster share across every one of its leagues.'));
  out.push(h);

  const S=DATA.signals||{};
  if(l.detail.supported || S.ok){
    const st=l.detail.supported? l.detail.standings : [];
    const mine=myTeam();
    const me=mine? st.find(s=> String(s.name).toLowerCase()===String(mine.name).toLowerCase()
      || String(s.name).toLowerCase()===String(mine.nameScraped||'').toLowerCase()) : null;
    const strip=el('div','strip');
    if(S.ok){
      strip.append(statTile('Add rate', S.trendFetchedAt? 'live' : '—',
        S.trendFetchedAt? 'Sleeper, '+new Date(S.trendFetchedAt).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}) : 'run trend:sync','market'));
      strip.append(statTile('Yahoo buzz', S.buzzDate||'—', S.buzzStale? 'stale — re-run buzz:sync' : 'all Yahoo leagues'));
    }
    // Waiver mechanics, from whichever of the three sources actually has them:
    // your own override first (you typed it), then the host, then nothing.
    const wo = ovFor(l).waivers || {};
    const budget = l.faabBudget ?? (l.detail.supported ? l.detail.settings.waiverBudget : null);
    const type = wo.type || l.waiverType || (l.detail.supported ? l.detail.settings.waiverType : null);
    if(type) strip.append(statTile('Waiver type', String(type).toUpperCase(),
      wo.type? 'from League Setup' : 'from '+l.host));
    if(wo.claimDays!=null || wo.processDay!=null){
      strip.append(statTile('Claims clear',
        wo.processDay!=null? DAYS[wo.processDay].slice(0,3) : wo.claimDays+'d',
        wo.claimDays!=null? wo.claimDays+'-day claim period' : 'processing day'));
    }
    if(me){
      if(me.waiverPosition!=null) strip.append(statTile('Your order', '#'+me.waiverPosition,'claim priority'));
      if(budget) strip.append(statTile('FAAB left', '$'+(budget-(me.waiverBudgetUsed??0)),
        '$'+(me.waiverBudgetUsed??0)+' of $'+budget+' spent','market'));
      else if(me.totalMoves!=null) strip.append(statTile('Your moves', String(me.totalMoves),'season total'));
    }
    out.push(strip);
  }

  const pool = DATA.pools[ (l.scoring||'PPR').toUpperCase()==='HALF' ? 'HALF' : ((l.scoring||'PPR').toUpperCase()==='STD'?'STD':'PPR') ] || [];
  if(!pool.length){ out.push(panel('Available', null, emptyState('No player pool', 'Run fp:sync to build the ranking boards.'))); return out; }
  const taken = allRostered();
  const free = pool.filter(p=> !taken.has(p.i));

  const bar=el('div','toggles');
  bar.append(segmented(Object.entries(SIG_SORTS).map(([k,v])=>({label:v.label,value:k})), waiverSort,
    v=>{ waiverSort=v; store.set('gd.waiverSort',v); render(); }));
  const posbar=el('div','legend');
  ['ALL','QB','RB','WR','TE','K','DST'].forEach(k=>{
    const b=el('button','iconbtn',k); b.type='button';
    if((waiverPos||'ALL')===k){ b.style.borderColor='var(--consensus)'; b.style.color='var(--consensus)'; }
    b.onclick=()=>{ waiverPos = k==='ALL'? null : k; render(); };
    posbar.append(b);
  });
  bar.append(posbar);
  out.push(bar);

  const inPos = (p)=> !waiverPos || p.p===waiverPos;
  const sorter = SIG_SORTS[waiverSort] || SIG_SORTS.surge;
  const clock = waiverClock(l);

  // --- the live board: free agents somebody, somewhere, is adding right now
  const hot = free.filter(p=> p.sig && inPos(p))
    .sort((a,b)=> sorter.of(b)-sorter.of(a) || (b.sig.h??0)-(a.sig.h??0))
    .slice(0,40);
  out.push(panel('Trending free agents', hot.length? sorter.note : null,
    hot.length ? signalTable(hot,{side:'add',note:true,clock})
      : emptyState('No signal yet', S.ok? 'No unrostered player in this league is charting on either board.' :
        'Run `npm run buzz:sync` and `npm run trend:sync`, then rebuild the dashboard.')));

  // --- drop side: rostered here, but the wider market is bailing out
  const dropping = pool.filter(p=> taken.has(p.i) && p.sig && inPos(p) &&
      ((p.sig.yn!=null && p.sig.yn<0) || (p.sig.yd!=null && p.sig.ya!=null && p.sig.yd>p.sig.ya)))
    .sort((a,b)=> (a.sig.yn??0)-(b.sig.yn??0)).slice(0,10);
  if(dropping.length){
    out.push(panel('Being dropped', 'rostered in this league, net-negative across Yahoo — the other side of the same board',
      signalTable(dropping,{side:'drop',note:true})));
  }

  // --- and the projection board, unchanged in purpose: best available on merit
  const best = free.filter(p=> p.wk!=null && inPos(p)).sort((a,b)=> (b.wk??0)-(a.wk??0)).slice(0,40);
  const rows=best.map(p=>{
    const tr=el('tr');
    tr.append(playerCell2(p));
    tr.append(waiverCell(clock,p));
    tr.append(Object.assign(el('td','r num'),{textContent:p.pr||'—'}));
    tr.append(stackCell(fmt(p.wk),null,{sep:1}));
    tr.append(gradeCell(p));
    tr.append(stackCell(fmt(p.ros,0),null));
    const hc=el('td','r');
    if(p.sig && p.sig.h!=null){
      const sp=el('span','delta '+(p.sig.h>=90?'up':(p.sig.h>=60?'flat':'')), String(p.sig.h));
      sp.title='Demand percentile: the better of his two boards\u2019 add ranks.';
      hc.append(sp);
    } else hc.append(el('span','delta flat','—'));
    tr.append(hc);
    tr.append(rosteredCell(p.sig));
    return tr;
  });
  const clockNote = clock.configured
    ? (clock.none ? 'no waivers in this league — everything is first-come'
      : 'waiver status derived from each player\u2019s last drop and this league\u2019s claim period')
    : 'set a claim period in League Setup to see waiver status';
  out.push(panel('Best available', 'top '+best.length+' by week-'+DATA.week+' projection \u00b7 '+clockNote,

/**
 * Transactions as the manager made them.
 *
 * One row is one MOVE, not one player: the add and the drop that paid for it
 * sit side by side, and a trade shows both sides. Split apart they read as
 * unrelated events — "who did they drop for him" is most of what a transaction
 * log is for, and it was the part being thrown away.
 */
const KIND = {
  add:   {label:'Add',   cls:'ok'},
  drop:  {label:'Drop',  cls:'gh'},
  swap:  {label:'Add/Drop', cls:'q'},
  trade: {label:'Trade', cls:'q'},
  other: {label:'Move',  cls:'gh'},
};
function kindPill(t){
  const k=KIND[t.kind]||KIND.other;
  const sp=el('span','pill '+k.cls, k.label);
  if(t.viaWaivers) sp.title='Came off waivers';
  return sp;
}

/** A stack of player chips for one side of a move. */
function movePlayers(items, sign){
  const w=el('div','mvside');
  if(!items.length){ w.append(el('span','note','—')); return w; }
  items.forEach(i=>{
    const row=el('div','mvp');

    if(i.playerTeam) row.append(imgEl(teamLogo(i.playerTeam),'tmlogo'));
    row.append(el('span','mvn', i.playerName||('fpId '+i.fpId)));
    if(i.playerPos) row.append(posChip(i.playerPos,'mini'));
    w.append(row);
  });
  return w;
}

const SOURCE_LABEL = {
  scrape:'MyPlaybook rosters', fp:'FantasyPros', vegas:'VegasEdge', 'vegas-dist':'VegasEdge distributions',
  wwo:'WinWithOdds', firstdown:'First Down Studio', fanduel:'FanDuel', buzz:'Yahoo BuzzIndex',
  trend:'Sleeper trending', leaguedetail:'Sleeper standings', 'sleeper-players':'Sleeper player dump', idmap:'Id map',
};

/**
 * How old every number on this site actually is.
 *
 * Two clocks, and conflating them is the mistake: "fetched" is when we pulled
 * it, "site said" is when the source itself last recomputed. A source can be
 * fetched a minute ago and be publishing yesterday's numbers, and without both
 * columns there is no way to tell that from a source that genuinely just moved.
 * Where a site publishes no recompute time, the column is honestly blank rather
 * than echoing our own clock back.
 */
function freshnessPanel(){
  const rows=(DATA.freshness||[]).map(f=>{
    const tr=el('tr'); if(f.stale) tr.className='benchrow';
    tr.append(Object.assign(el('td'),{textContent:SOURCE_LABEL[f.source]||f.source}));
    const a=el('td','r');
    a.append(el('span','delta '+(f.stale?'dn':'up'), f.age));
    a.title=f.fetchedAt? new Date(f.fetchedAt).toLocaleString() : '';
    tr.append(a);
    const sa=el('td','r');
    if(f.sourceAge){ sa.append(el('span','num',f.sourceAge)); sa.title='The site\u2019s own last-recomputed time: '+new Date(f.sourceAt).toLocaleString(); }
    else { sa.append(el('span','note','—')); sa.title='This source publishes no update time; age is ours alone.'; }
    tr.append(sa);
    tr.append(Object.assign(el('td','r num'),{textContent:f.items==null?'—':String(f.items)}));
    const st=el('td');
    if(f.failed) st.append(el('span','pill out',f.failed+' failed'));
    else st.append(el('span','pill '+(f.stale?'q':'ok'), f.stale?'stale':'fresh'));
    tr.append(st);
    return tr;
  });
  if(!rows.length){
    return panel('Data freshness', null, emptyState('No sync recorded yet','Run `npm run sync` to populate the ledger.'));
  }
  const stale=(DATA.freshness||[]).filter(f=>f.stale).length;
  return panel('Data freshness', stale? stale+' source(s) past their refresh window \u2014 `npm run sync`' : 'everything current',
    table([{label:'Source'},{label:'Fetched',r:1},{label:'Site said',r:1},{label:'Rows',r:1},{label:''}], rows));
}

function field(label, control, hint){
  const d=el('div','fld');
  d.append(el('label','lbl',label));
  d.append(control);
  if(hint) d.append(el('div','fhint',hint));
  return d;
}
function textInput(value, onCommit, placeholder){
  const i=el('input'); i.type='text'; i.value=value??''; if(placeholder) i.placeholder=placeholder;
  // Commit on blur and on Enter, not on every keystroke: a re-render per
  // character would take the focus out of the field being typed into.
  const commit=()=>{ const v=i.value.trim(); onCommit(v===''? null : v); };
  i.addEventListener('blur',commit);
  i.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); i.blur(); } });
  return i;
}
function numInput(value, onCommit, {min,max,placeholder}={}){
  const i=el('input'); i.type='number'; i.value=value??''; i.style.maxWidth='90px';
  if(min!=null) i.min=min; if(max!=null) i.max=max; if(placeholder) i.placeholder=placeholder;
  const commit=()=>{ const v=i.value.trim(); onCommit(v===''? null : Number(v)); };
  i.addEventListener('blur',commit);
  i.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); i.blur(); } });
  return i;
}
function selectInput(options, value, onPick){
  const sel=el('select');
  options.forEach(o=>{ const op=el('option',null,o.label); op.value=o.value==null?'':o.value; sel.append(op); });
  sel.value = value==null? '' : String(value);
  sel.onchange=()=> onPick(sel.value===''? null : sel.value);
  return sel;
}

    'How long a dropped player sits before clearing to free agency.'));
  wg.append(field('Claims process on',
    selectInput([{value:null,label:'—'},...['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].map((d,i)=>({value:i,label:d}))],
      wv.processDay, v=>{ edits.set(l.key,{waivers:{processDay: v==null?null:Number(v)}}); render(); }),
    'Used to say when a player clears.'));
  wg.append(field('at hour',
    numInput(wv.processHour, v=>{ edits.set(l.key,{waivers:{processHour:v}}); render(); }, {min:0,max:23,placeholder:'3'}),
    '24h, your local time.'));
  wb.append(wg);
  if(wv.processDay!=null){
    const d=el('p','note'); d.style.marginTop='10px';
    d.textContent='→ '+describeWaivers(wv);
    wb.append(d);
  }
  out.push(panel('Waivers', null, wb));
  return out;
}

/** Plain-English restatement of the configured seeding rule. */
function describeSeedRule(c){
  const tb=(DATA.rules.tiebreak[c.tiebreak]||'Points for').toLowerCase();
  const n=c.playoffTeams ?? '?';
  if(c.rule==='record') return 'Seeds 1–'+n+' by record, ties broken by '+tb+'.';
  if(c.rule==='division-first') return 'Top '+(c.divisionSeeds ?? 2)+' seeds are division winners; the rest by record, ties broken by '+tb+'.';
  if(c.rule==='points-wildcard') return 'Seeds 1–'+(Number(n)-(c.wildcards ?? 1))+' by record; the final '+(c.wildcards ?? 1)+' by most points for among everyone who missed.';
  return '';
}
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function describeWaivers(w){
  const hr=w.processHour!=null? ' at '+(w.processHour%12||12)+(w.processHour<12?'am':'pm') : '';
  return 'Claims process '+DAYS[w.processDay]+hr+(w.claimDays!=null? '; dropped players sit '+w.claimDays+' day(s) before clearing.' : '.');
}

/**
 * Write the local edits out as the file `league:import` reads.
 *
 * A download is the only way off a page with no server. Anchor downloads are
 * blocked in some embedded viewers, so the JSON is also dropped into a
 * selectable box — a copy-paste always works.
 */
function exportEdits(){
  const body={ exportedAt:new Date().toISOString(), leagues: edits.all() };
  const json=JSON.stringify(body,null,2);
  const n=Object.keys(body.leagues).length;
  if(!n){ alert('No local edits to export.'); return; }
  try{
    const url=URL.createObjectURL(new Blob([json],{type:'application/json'}));
    const a=el('a'); a.href=url; a.download='league-overrides.patch.json';
    document.body.append(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch{ /* download blocked; the box below still works */ }
  const dlg=el('div','exportbox');
  dlg.append(el('h3',null,'Edits for '+n+' league(s)'));
  dlg.append(Object.assign(el('p','note'),{textContent:'Save as league-overrides.patch.json, then: node src/cli.js league:import league-overrides.patch.json'}));
  const ta=el('textarea'); ta.value=json; ta.readOnly=true; ta.rows=14;
  dlg.append(ta);
  const close=el('button','iconbtn','Close'); close.type='button'; close.onclick=()=>dlg.remove();
  dlg.append(close);
  $('#page').prepend(dlg);
  ta.focus(); ta.select();
}

const RENDER={leagues:pageLeagues,manage:pageManage,overview:pageOverview,myteam:pageMyTeam,matchup:pageMatchup,standings:pageStandings,waivers:pageWaivers,edge:pageEdge,moves:pageMoves,league:pageLeague};

function render(){
  const host=$('#page');
  host.innerHTML='';
  const nodes=(RENDER[page]||pageOverview)();
  nodes.forEach(n=> host.append(n));
  window.scrollTo({top:0});
}
addEventListener('hashchange',()=>{
  const h=readHash();
  if(h.league){ const m=leagues.find(l=>l.key===h.league); if(m) current=m; }
  if(h.page && PAGES.some(p=>p.id===h.page)) page=h.page;
  renderChrome(); render();
});
writeHash();
renderChrome();
render();
})();
</script>
