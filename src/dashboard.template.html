<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<title>Gridiron Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F6F7F4; --surface:#FFFFFF; --surface-2:#EFF1ED; --line:#DCDFD8; --line-strong:#C2C7BC;
  --ink:#131A21; --ink-2:#42505F; --muted:#6E7C8C;
  --market:#9A6410; --market-soft:#F3E6CF;
  --consensus:#33508A; --consensus-soft:#DFE5F2;
  --good:#1F6B4A; --good-soft:#D8EBE985; --warn:#96600B; --bad:#9C3A32; --bad-soft:#F6E0DD;
  --shadow:0 1px 2px rgba(19,26,33,.06),0 4px 14px rgba(19,26,33,.05);
  --rail:210px;
  /* Sleeper's position palette, so slots read the same as they do in the app */
  --p-qb:#FF2A6D; --p-rb:#00CEB8; --p-wr:#58A7FF; --p-te:#FFAE58;
  --p-k:#BD66FF; --p-dst:#7988A1; --p-flex:#59C2C9; --p-sf:#FF8FBF; --p-bn:#B8C1CB;
  --pos-ink:#022047;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0F141A; --surface:#161D26; --surface-2:#1D2732; --line:#2A3642; --line-strong:#3C4A58;
    --ink:#E7EDF3; --ink-2:#B3C0CD; --muted:#8496A6;
    --market:#D79B3C; --market-soft:#3A2C14;
    --consensus:#8FAEE4; --consensus-soft:#1C2740;
    --good:#5FC095; --good-soft:#15302690; --warn:#D9A038; --bad:#E2786D; --bad-soft:#37211F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --ground:#0F141A; --surface:#161D26; --surface-2:#1D2732; --line:#2A3642; --line-strong:#3C4A58;
  --ink:#E7EDF3; --ink-2:#B3C0CD; --muted:#8496A6;
  --market:#D79B3C; --market-soft:#3A2C14;
  --consensus:#8FAEE4; --consensus-soft:#1C2740;
  --good:#5FC095; --good-soft:#15302690; --warn:#D9A038; --bad:#E2786D; --bad-soft:#37211F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
td,th,.stat .v,.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:"Barlow Condensed","IBM Plex Sans",sans-serif;font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:30px;line-height:1.1}
h2{font-size:21px;line-height:1.15}
h3{font-size:15px;line-height:1.2;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
a{color:var(--consensus)}
/* Columns of numbers still need to line up; they do not need to look like a
   receipt. Tabular figures give the alignment on the same face as the rest of
   the page, so a table reads as one design instead of two. */
.num{font-variant-numeric:tabular-nums;letter-spacing:0}

/* shell */
.shell{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:20px;padding-block:18px;padding-inline:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:baseline;gap:7px}
.brand b{font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:700;letter-spacing:.02em}
.brand span{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
nav{display:flex;flex-direction:column;gap:1px}
nav button{all:unset;cursor:pointer;padding:7px 10px;border-radius:5px;font-size:13.5px;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center;gap:8px}
nav button:hover{background:var(--surface-2);color:var(--ink)}
nav button[aria-current="true"]{background:var(--consensus-soft);color:var(--consensus);font-weight:600}
nav button:focus-visible{outline:2px solid var(--consensus);outline-offset:1px}
nav .tag{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.rail-foot{margin-top:auto;font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:6px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{border-bottom:1px solid var(--line);background:var(--surface);padding-block:12px;padding-inline:24px;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;position:sticky;top:0;z-index:5}
.lg-switch{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
label.lbl{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
select{font-family:inherit;font-size:13.5px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line-strong);border-radius:6px;padding:6px 9px;max-width:min(300px,60vw)}
select.hz{max-width:220px;padding:5px 8px;font-size:12.5px}
select:focus-visible{outline:2px solid var(--consensus);outline-offset:1px}
.spacer{flex:1}
.wk{font-size:11.5px;color:var(--muted)}
.iconbtn{all:unset;cursor:pointer;padding:6px 9px;border-radius:6px;border:1px solid var(--line-strong);font-size:12px;color:var(--ink-2)}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn:focus-visible{outline:2px solid var(--consensus);outline-offset:1px}
.page{padding-block:22px 48px;padding-inline:24px;display:flex;flex-direction:column;gap:22px;max-width:1220px;width:100%}

/* pieces */
.head{display:flex;flex-direction:column;gap:3px}
.head p{margin:0;color:var(--muted);font-size:13px;max-width:70ch}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.stat{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.stat .k{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.stat .v{font-family:"Barlow Condensed",sans-serif;font-size:25px;font-weight:700;line-height:1.05}
.stat .s{font-size:11px;color:var(--muted)}
.v.market{color:var(--market)} .v.consensus{color:var(--consensus)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);overflow:hidden}
.panel>header{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel>header h3{margin:0}
.panel>header .spacer{flex:1}
.pbody{padding:14px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;align-items:start}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
/* Projection tables set every source column to the SAME fixed width, so five
   sources read as one scale instead of five differently-sized ones. Fixed
   layout is what makes the colgroup binding rather than advisory. */
table.fixed{table-layout:fixed}
.srcth{display:flex;flex-direction:column;align-items:flex-end;gap:2px;line-height:1}
.srcth img{width:13px;height:13px;object-fit:contain;border-radius:3px}
.srcth b{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--ink-2)}
th.r .srcth{align-items:flex-end}
th{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;text-align:left;padding:6px 9px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
th.band{text-align:center;border-bottom:1px solid var(--line-strong);color:var(--ink-2);letter-spacing:.11em;padding-block:5px}
th.band+th.band,td.bandsep{border-left:1px solid var(--line)}
.tsep{border-left:1px solid var(--line)}
td{padding:3px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td.r,th.r{text-align:right}
.pl{display:flex;align-items:center;gap:9px;min-width:0}
/* Same lesson as the avatar: a name block is a shape, not a context. */
.nm{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.nm b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{color:var(--muted);font-size:10.5px}
.prow{display:flex;align-items:center;gap:10px;min-width:0}
/**
 * The headshot fills the row.
 *
 * Sleeper's thumbnails are waist-up crops on a wide canvas, so a 38px circle of
 * the whole frame renders a face about twelve pixels across — technically a
 * photo, practically a smudge. `scale(1.45)` inside a clipped circle throws
 * away the empty shoulders and lets the head fill it, which is the only part
 * anyone recognises. The ring carries the position in its own colour, so the
 * row needs no separate coloured badge.
 */
/* Scoped to nothing: an avatar is a SIZE, not a context. Scoping this to
   `.prow` and `.pl` meant the matchup cards drew the raw image at its natural
   width the moment they started using the same helper. */
.av{--c:var(--p-bn);width:46px;height:46px;border-radius:50%;flex:none;
  background:var(--surface-2);border:2px solid var(--c);position:relative;overflow:hidden;display:block}
.av img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;
  transform:scale(1.45);transform-origin:50% 18%;display:block}
/* Team marks are logos, not faces: no crop, no zoom, and a square frame. */
.av.logo{border-radius:10px}
.av.logo img{transform:none;object-fit:contain;padding:4px}
table.fixed td .prow, table.fixed td .pl{padding-block:1px}
.prow .who{display:flex;flex-direction:column;gap:2px;min-width:0}
.prow .who .pn{font-size:15px;font-weight:600;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stack{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
table.fixed td{padding:2px 7px}
table.fixed th{padding:6px 7px;overflow:hidden}
/* Fixed layout sizes from the colgroup, but a nowrap header still sets a
   minimum the table honours; letting band labels clip keeps a long one from
   widening the table past its container. */
table.fixed th.band{overflow:hidden;text-overflow:clip}
.stack .sv{font-variant-numeric:tabular-nums;font-size:14px;font-weight:500}
.stack .ss{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.stack .sv.big{font-size:15px;font-weight:700}
.scored{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;color:var(--ink)}
.scored.zero{font-weight:400;color:var(--muted)}
/* Solid position squares, matching Sleeper's slot chips. */
.pos{--c:var(--p-flex);display:inline-flex;align-items:center;justify-content:center;text-align:center;
  font-size:10px;font-weight:700;letter-spacing:.02em;border-radius:6px;overflow:hidden;
  width:30px;height:20px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.pos[data-p]{background:var(--c);color:var(--pos-ink);border-color:transparent}
.pos[data-p="QB"]{--c:var(--p-qb)} .pos[data-p="RB"]{--c:var(--p-rb)} .pos[data-p="WR"]{--c:var(--p-wr)}
.pos[data-p="TE"]{--c:var(--p-te)} .pos[data-p="K"]{--c:var(--p-k)} .pos[data-p="DST"]{--c:var(--p-dst)}
.pos[data-p="DEF"]{--c:var(--p-dst)} .pos[data-p="FLEX"]{--c:var(--p-flex)}
.pos[data-p="SF"]{--c:var(--p-sf)} .pos[data-p="BN"]{--c:var(--p-bn)}
.slot{width:42px;height:32px;font-size:10.5px;border-radius:8px;flex:none;margin-right:2px}
.slotcell{display:flex;align-items:center;gap:6px}
/* team logo · TEAM · position, all at one weight below the name */
.subt{display:flex;align-items:center;gap:4px;line-height:1}
/* Scoped to .subt originally, which silently did nothing the first time the
   class was reused outside a player subtitle. It is a size, not a context. */
.tmlogo{width:14px;height:14px;object-fit:contain;flex:none;opacity:.9}
.subt .tm{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.03em}
.subt .dot{font-size:10px;color:var(--line-strong);margin-inline:1px}
/* Outlined, not filled — the subtext badge labels the player, it does not
   flag him. Filled chips stay for roster SLOTS, where the colour is the point. */
.pos.mini{width:auto;min-width:22px;height:14px;padding-inline:4px;font-size:9px;border-radius:3px;
  background:transparent;color:var(--c);border:1px solid var(--c);letter-spacing:.04em}
.pos.mini[data-p]{background:transparent;color:var(--c);border-color:var(--c)}
.subt .pill{font-size:9px;padding:1px 5px;font-weight:700}
.toggles{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:5px 11px;font-size:12px;color:var(--ink-2);background:var(--surface)}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--consensus-soft);color:var(--consensus);font-weight:600}
.seg button:focus-visible{outline:2px solid var(--consensus);outline-offset:-2px}
.grouphdr td{background:var(--surface-2);font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;padding:6px 10px}
.totrow td{border-top:2px solid var(--line-strong);font-weight:600;background:var(--surface-2)}
/* ---- matchup page ---------------------------------------------------
   Two mirrored cards per slot with the badge between them, the way every host
   draws it. Each side is its own card so the row reads as two things being
   compared rather than one wide strip of text. */
.munav{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.mustrip{display:flex;gap:6px;overflow-x:auto;padding:2px;flex:1;scrollbar-width:thin}
.muchip{display:flex;align-items:center;gap:5px;padding:5px 8px;border-radius:9px;flex:none;
  border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink-2)}
.muchip:hover{border-color:var(--line-strong)}
.muchip.on{border-color:var(--consensus);background:var(--consensus-soft);color:var(--ink)}
.muchip.mine{box-shadow:inset 0 -2px 0 var(--consensus)}
.muchip .tav{width:22px;height:22px;border-radius:6px}
.muchip .mc{font-size:11.5px;font-variant-numeric:tabular-nums;font-weight:600}
.muchip .vs{font-size:10px;color:var(--muted)}
.muhead{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;padding-bottom:12px}
.muteam{display:flex;align-items:center;gap:11px;min-width:0}
.muteam.b{flex-direction:row;justify-content:flex-end;text-align:right}
.muteam .tav{width:44px;height:44px;border-radius:11px}
.mun{min-width:0;display:flex;flex-direction:column;gap:3px;flex:1;align-items:flex-start}
.muteam.b .mun{align-items:flex-end}
.mun b{font-family:"Barlow Condensed",sans-serif;font-size:20px;font-weight:700;line-height:1.05;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.musc{text-align:right;flex:none}
.muteam.b .musc{text-align:left}
.musc .p1{font-family:"Barlow Condensed",sans-serif;font-size:32px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.musc .p2{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.muvs{font-size:11px;color:var(--muted);letter-spacing:.12em;font-weight:700;text-align:center;white-space:nowrap}
.muband{font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600;
  padding:10px 0 6px;border-top:1px solid var(--line);margin-top:8px}
.murow{display:grid;grid-template-columns:1fr 48px 1fr;gap:8px;align-items:stretch;margin-bottom:6px}
.muside{display:flex;align-items:center;gap:9px;min-width:0;padding:7px 10px;border-radius:9px;
  border:1px solid var(--line);background:var(--surface-2)}
.muside .note{margin:auto}
.muwho{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.muwho .av{width:36px;height:36px;border-width:2px}
.muside.b .muwho{flex-direction:row-reverse;text-align:right}
.munm{min-width:0;display:flex;flex-direction:column;gap:1px}
.munm .l1{display:flex;align-items:center;gap:5px;min-width:0}
.muside.b .munm .l1{justify-content:flex-end}
.munm .l1 b{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.munm .l1 .tm{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.04em;flex:none}
.munm .l2{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.muval{flex:none;text-align:right;min-width:54px}
.muside.b .muval{text-align:left}
.muval .pv{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.muval .pv.dim{color:var(--muted);font-weight:400}
.muval .pj{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.mumid{display:flex;align-items:center;justify-content:center}
.mutot .muside{background:transparent;border-color:var(--line-strong);border-width:0;border-top-width:2px;border-radius:0}
.mutot .grow{flex:1}
.muslots.bench .muside{background:transparent;opacity:.82}
@media (max-width:720px){
  .murow{grid-template-columns:1fr 40px 1fr;gap:5px}
  .muside{padding:6px 7px;gap:6px}
  .munm .l1 b{font-size:12.5px}
  .muhead{gap:8px}
  .musc .p1{font-size:24px}
  .muteam .tav{width:34px;height:34px}
}
tr.benchrow td{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.wp{display:flex;flex-direction:column;gap:5px;min-width:150px}
.wpbar{height:7px;border-radius:4px;overflow:hidden;display:flex;background:var(--surface-2);border:1px solid var(--line)}
.wpbar i{display:block;height:100%}
.wpnums{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.teamhead{display:flex;align-items:center;gap:9px}
.teamhead img{width:30px;height:30px;border-radius:6px;object-fit:contain;background:var(--surface-2)}
.gt{font-size:11px;color:var(--muted)}
.pill{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.03em;padding:2px 6px;border-radius:99px;border:1px solid transparent}
.pill.out{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.pill.q{background:var(--market-soft);color:var(--warn);border-color:var(--warn)}
.pill.ok{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.pill.gh{background:var(--surface-2);color:var(--muted);border-color:var(--line-strong)}
.delta{font-variant-numeric:tabular-nums;font-weight:500}
.delta.up{color:var(--good)} .delta.dn{color:var(--bad)} .delta.flat{color:var(--muted)}
.bar{position:relative;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;min-width:54px}
.bar i{position:absolute;inset-block:0;left:0;background:var(--consensus);border-radius:3px}
.bar i.mk{background:var(--market)}
.grade{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:15px}
.note{color:var(--muted);font-size:12.5px;margin:0}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:6px;align-items:center}
.empty b{color:var(--ink-2);font-weight:600}
/* league scoreboard: one card per matchup, two rows each */
.sbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;padding:14px}
.sbcard{border:1px solid var(--line);border-radius:9px;background:var(--surface);overflow:hidden}
.sbcard.mine{border-color:var(--consensus);box-shadow:inset 3px 0 0 var(--consensus)}
.sbrow{display:flex;align-items:center;gap:9px;padding:7px 11px;border-bottom:1px solid var(--line)}
.sbrow:last-of-type{border-bottom:0}
.sbn{flex:1;min-width:0;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbp{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink-2);min-width:56px;text-align:right}
.sbp.lead{color:var(--ink);font-weight:700}
.sbj{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:42px;text-align:right}
.sbbye{color:var(--muted);font-size:12px;justify-content:center}
.sbfoot{display:flex;align-items:center;gap:8px;padding:6px 11px;background:var(--surface-2);font-size:11px;color:var(--muted)}
/* Fantasy-team crests: square, uncropped, never zoomed like a headshot. */
.tav{width:30px;height:30px;border-radius:8px;flex:none;overflow:hidden;display:block;
  background:var(--surface-2);border:1px solid var(--line)}
.tav img{width:100%;height:100%;object-fit:contain;display:block}
tr.mine .tav{border-color:var(--consensus)}
.seedno{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;
  font-weight:700;font-size:12px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

<script id="payload" type="application/json">/*__DATA__*/null</script>
<script>
(function(){
"use strict";
const DATA = JSON.parse(document.getElementById('payload').textContent);
const $ = (s,r)=> (r||document).querySelector(s);
const el = (t,c,txt)=>{const e=document.createElement(t); if(c)e.className=c; if(txt!=null)e.textContent=txt; return e;};
const num = (v,d)=> v==null||v===''? '—' : Number(v).toFixed(d==null?1:d);
/* Used where a string is concatenated into innerHTML, so it has to actually escape. */
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ---------- theme ---------- */
const store = {
  get(k,f){ try{ const v=localStorage.getItem(k); return v==null?f:v; }catch{ return f; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch{} }
};
const themeBtn = $('#themeBtn');
const savedTheme = store.get('gd.theme', null);
if(savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
themeBtn.addEventListener('click', ()=>{
  const cur = document.documentElement.getAttribute('data-theme');
  const isDark = cur ? cur==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const next = isDark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  store.set('gd.theme', next);
});

/* ---------- helpers ---------- */
const POS_ORDER = {QB:1,RB:2,WR:3,TE:4,K:5,DST:6};
const ACTION = {ADD:['Add','ok'],DROP:['Drop','gh'],TRADE_FOR:['Trade in','q'],TRADE_AWAY:['Trade out','q'],TRADE:['Trade','q']};
function actionPill(a){
  const [label,cls] = ACTION[String(a||'').toUpperCase()] || [String(a||'—').replace(/_/g,' ').toLowerCase(),'gh'];
  return el('span','pill '+cls, label);
}
const byPos = (a,b)=> (POS_ORDER[a.p]||9)-(POS_ORDER[b.p]||9) || (b.wk??-1)-(a.wk??-1);
const sum = (arr,f)=> arr.reduce((s,x)=> s + (Number(f(x))||0), 0);

/**
 * Injury designation, or nothing.
 *
 * ACTIVE is not a designation — it is the absence of one, and on a roster where
 * almost everyone is active a green pill on almost every row carries no
 * information while costing every row the space. Only a real flag renders.
 */
const INJ_ABBR = {QUESTIONABLE:'Q', DOUBTFUL:'D', PROBABLE:'P', OUT:'OUT', IR:'IR',
  SUSPENDED:'SUSP', PUP:'PUP', DNR:'DNR', NA:'NA'};
function injPill(p){
  if(!p.inj) return null;
  const s = String(p.inj).toUpperCase();
  if(s==='ACTIVE'||s==='HEALTHY') return null;
  const cls = (s==='OUT'||s==='IR'||s==='SUSPENDED'||s==='PUP') ? 'out' : 'q';
  const sp = el('span','pill '+cls, INJ_ABBR[s] || s);
  sp.title = [p.inj, p.injT].filter(Boolean).join(' — ');
  return sp;
}
function deltaCell(v){
  const td = el('td','r');
  if(v==null){ td.append(el('span','delta flat','—')); return td; }
  const s = (v>0?'+':'')+Number(v).toFixed(1);
  td.append(el('span','delta '+(v>0.4?'up':(v<-0.4?'dn':'flat')), s));
  return td;
}
const POS_VAR = {QB:'--p-qb',RB:'--p-rb',WR:'--p-wr',TE:'--p-te',K:'--p-k',DST:'--p-dst',DEF:'--p-dst',BN:'--p-bn'};
/**
 * Multi-position slots are written as the initials of what they accept:
 * WR/RB/TE -> WRT, QB/WR/RB/TE -> QWRT. Each gets one solid colour.
 */
function slotLabel(slot){
  const parts=String(slot||'').toUpperCase().split('/').map(x=>x.trim()).filter(Boolean);
  if(parts.length<2) return String(slot||'—').toUpperCase();
  const order=['QB','WR','RB','TE'];
  const set=new Set(parts);
  return order.filter(x=>set.has(x)).map(x=>x[0]).join('') || 'FLEX';
}
/** SF when a flex slot also takes a QB, otherwise FLEX. */
function slotKind(slot){
  const parts=String(slot||'').toUpperCase().split('/').map(x=>x.trim()).filter(Boolean);
  if(parts.length<2) return null;
  return parts.includes('QB') ? 'SF' : 'FLEX';
}
function posChip(pos, extraClass){
  const key=String(pos||'').toUpperCase();
  const known=['QB','RB','WR','TE','K','DST','DEF','BN'];
  const multi=key.includes('/');
  const sp=el('span','pos'+(extraClass?' '+extraClass:''), multi ? slotLabel(key) : (pos||'—'));
  sp.setAttribute('data-p', known.includes(key) ? key : (multi ? slotKind(key) : (key||'FLEX')));
  if(multi) sp.title=key;
  return sp;
}

const teamLogo = (t) => 'https://sleepercdn.com/images/team_logos/nfl/'+String(t||'').toLowerCase()+'.png';

/**
 * One lazy <img> that hides itself if the URL 404s.
 *
 * Four places were each re-implementing this — headshots, the team mark under a
 * name, matchup team heads, standings avatars — and only some of them set
 * loading="lazy" or handled the error, so a missing image left a broken-icon
 * box in some tables and nothing in others.
 */
function imgEl(src, cls){
  const i=el('img',cls||null); i.loading='lazy'; i.alt=''; i.decoding='async';
  if(!src){ i.style.visibility='hidden'; return i; }
  i.src=src;
  i.addEventListener('error',()=>{ i.style.visibility='hidden'; });
  return i;
}

/**
 * Headshot in a clipped, position-coloured frame; DSTs use the team logo.
 *
 * The frame is a wrapper rather than the image itself because the image is
 * scaled up inside it — a transform on the element that also draws the border
 * would scale the border too.
 */
function avatarFor(p){
  const box=el('span','av');
  const pv = POS_VAR[String(p.p||'').toUpperCase()];
  if(pv) box.style.setProperty('--c','var('+pv+')');
  const pos = String(p.p||'').toUpperCase();
  if((pos==='DST'||pos==='DEF') && p.t){
    box.classList.add('logo');
    box.append(imgEl(teamLogo(p.t)));
  } else {
    box.append(imgEl(p.s ? 'https://sleepercdn.com/content/nfl/players/thumb/'+p.s+'.jpg' : null));
  }
  return box;
}

/**
 * The line under a player's name: team logo, team, position, injury flag.
 *
 * Bye week used to live here. It was the only value on the line that is not
 * about this week, and on a week view it read as noise attached to every
 * healthy starter; it is still in the payload for whatever wants it.
 */
function subLine(p){
  const sub=el('div','subt');
  if(p.t){
    sub.append(imgEl(teamLogo(p.t),'tmlogo'));
    sub.append(el('span','tm', p.t));
  }
  if(p.p){
    if(p.t) sub.append(el('span','dot','\u00b7'));
    sub.append(posChip(p.p,'mini'));
  }
  const ip=injPill(p); if(ip) sub.append(ip);
  return sub;
}

/** Slot badge, headshot and name all in one cell, as Sleeper lays it out. */
function rosterCell(p, slot){
  const td=el('td');
  const w=el('div','prow');
  if(slot!==undefined && slot!==null) w.append(posChip(slot,'slot'));
  w.append(avatarFor(p));
  const who=el('div','who');
  who.append(Object.assign(el('div','pn'),{textContent:p.n||('fpId '+p.i)}));
  who.append(subLine(p));
  w.append(who);
  td.append(w);
  return td;
}

/** A number with a smaller line beneath it (e.g. projection over positional rank). */
function stackCell(value, sub, opts){
  const td=el('td','r'+(opts&&opts.sep?' tsep':''));
  const d=el('div','stack');
  d.append(Object.assign(el('div','sv'+(opts&&opts.big?' big':'')),{textContent:value}));
  if(sub!=null && sub!=='') d.append(Object.assign(el('div','ss'),{textContent:sub}));
  td.append(d);
  return td;
}

/**
 * Two-tier header: a band row grouping columns, then the column labels.
 *
 * A column may carry `w` (a fixed pixel width) and `node` (a rendered header
 * instead of a text label). When any column sets `w` the table switches to
 * fixed layout and a colgroup is emitted, which is the only way to force every
 * source column to the same width regardless of what lands in it.
 */
function table2(bands, cols, rows){
  const wrap=el('div','scroll');
  const fixed=cols.some(c=>c.w);
  const t=el('table',fixed?'fixed':null);
  if(fixed){
    const cg=el('colgroup');
    cols.forEach(c=>{ const co=el('col'); if(c.w) co.style.width=c.w+'px'; cg.append(co); });
    t.append(cg);
  }
  const thead=el('thead');
  if(bands && bands.length){
    const br=el('tr');
    bands.forEach(b=>{
      const th=el('th',(b.label?'band':''),b.label||'');
      th.colSpan=b.span; br.append(th);
    });
    thead.append(br);
  }
  const hr=el('tr');
  cols.forEach(c=>{
    const th=el('th',(c.r?'r':'')+(c.sep?' tsep':''), c.node?null:c.label);
    if(c.node) th.append(c.node);
    if(c.title) th.title=c.title;
    hr.append(th);
  });
  thead.append(hr);
  t.append(thead);
  const tb=el('tbody'); rows.forEach(r=>tb.append(r)); t.append(tb);
  wrap.append(t); return wrap;
}
function posCell(p){ const td=el('td'); td.append(posChip(p.p)); return td; }
function slotCell(slot,pos){
  const td=el('td');
  const w=el('div'); w.style.display='flex'; w.style.gap='5px'; w.style.alignItems='center';
  w.append(posChip(slot,'slot'));
  if(pos && pos!==slot) w.append(posChip(pos));
  td.append(w); return td;
}
function gradeCell(p){
  const td = el('td','r');
  const g = el('span','grade', p.g||'—');
  if(p.g){ const first=p.g[0]; g.style.color = first==='A'?'var(--good)' : first==='B'?'var(--consensus)' : first==='C'?'var(--muted)' : 'var(--bad)'; }
  else g.style.color='var(--muted)';
  td.append(g); return td;
}
/* ---------- lineup construction ---------- */
const SLOT_ELIG = {
  QB:['QB'], RB:['RB'], WR:['WR'], TE:['TE'], K:['K'], DST:['DST','DEF'], DEF:['DST','DEF'],
  'W/R':['WR','RB'], 'W/T':['WR','TE'], 'R/T':['RB','TE'],
  'W/R/T':['WR','RB','TE'], 'WR/RB/TE':['WR','RB','TE'], FLEX:['WR','RB','TE'],
  OP:['QB','WR','RB','TE'], SUPERFLEX:['QB','WR','RB','TE'], 'Q/W/R/T':['QB','WR','RB','TE']
};
function slotEligible(slot){
  const k=String(slot||'').toUpperCase().trim();
  if(SLOT_ELIG[k]) return SLOT_ELIG[k];
  if(k.includes('/')) return k.split('/').map(x=>x.trim()).filter(Boolean);
  return [k];
}
const isBench = s => /^(BN|BE|BENCH|IR|TAXI)$/i.test(String(s||'').trim());

/**
 * The real lineup when MyPlaybook serves it; otherwise a best-fit lineup built
 * from the league's slot template and week projections. The two are labelled
 * differently — a computed lineup is not what the manager actually set.
 */
function lineupFor(l, team){
  const M = l.adv && l.adv.matchup;
  if(M && M.ok && team && team.mine){
    const side = [M.team1,M.team2].find(t=> t && String(t.id)===String(l.myTeamId)) || M.team1;
    if(side){
      const byId = new Map(team.players.map(p=>[p.i,p]));
      const map = s => Object.assign({}, byId.get(s.fpId)||{i:s.fpId,n:s.name,t:s.team,p:s.pos}, {slot:s.slot, live:s.proj, gameTime:s.time, gameStatus:s.game});
      return { source:'actual', starters: side.starters.map(map), bench: side.bench.map(x=>Object.assign(map(x),{slot:'BN'})) };
    }
  }
  const slots = (l.rosterSlots||[]).filter(x=>x);
  if(!slots.length || !team) return { source:'none', starters:[], bench:(team?team.players:[]).map(p=>Object.assign({slot:'BN'},p)) };
  const pool = team.players.slice().sort((a,b)=> (b.wk??-1)-(a.wk??-1));
  const used = new Set();
  const starters = [];
  slots.filter(sl=>!isBench(sl)).forEach(sl=>{
    const elig = slotEligible(sl);
    const pick = pool.find(p=> !used.has(p.i) && elig.includes(String(p.p||'').toUpperCase()));
    if(pick) used.add(pick.i);
    starters.push(Object.assign({slot:sl}, pick||{}));
  });
  const bench = pool.filter(p=>!used.has(p.i)).map(p=>Object.assign({slot:'BN'},p));
  return { source:'computed', starters, bench };
}

/* ---------- shared cells ---------- */
/** Player cell: headshot, name, then a coloured position badge + team + bye. */
function playerCell2(p){
  const td = el('td');
  const w = el('div','pl');
  w.append(avatarFor(p));
  const nm=el('div','nm');
  nm.append(el('b',null,p.n||('fpId '+p.i)));
  nm.append(subLine(p));
  w.append(nm);
  td.append(w);
  return td;
}

function table(cols, rows){
  const wrap = el('div','scroll');
  const t = el('table');

/* ---------- local edits ----------
 *
 * This page is a static file with no server, so an edit has nowhere to go but
 * the browser. It goes to localStorage, layered OVER the overrides the build
 * baked in from data/league-overrides.json, and Export writes the merged result
 * back out as a file for `league:import`.
 *
 * The layering matters: a value you changed here and a value already committed
 * to the file must be distinguishable, or "Export" would silently re-assert
 * every default as if you had chosen it. Only genuinely changed keys are kept.
 */
const edits = (()=>{
  const KEY='gd.leagueEdits';
  let mem={};
  try{ mem=JSON.parse(localStorage.getItem(KEY)||'{}')||{}; }catch{ mem={}; }
  const persist=()=>{ try{ localStorage.setItem(KEY, JSON.stringify(mem)); }catch{ /* private window */ } };
  return {
    all: ()=>mem,
    forLeague: (key)=> mem[key] || {},
    /** How many fields this league has pending, for the nav badge. */
    count: (key)=>{
      const e=mem[key]; if(!e) return 0;
      let n=0;
      for(const [k,v] of Object.entries(e)){
        if(v==null) continue;
        if(k==='teams'||k==='scoring') n+=Object.keys(v).length;
        else if(k==='playoffs'||k==='waivers') n+=Object.values(v).filter(x=>x!=null&&x!=='').length;
        else if(Array.isArray(v)) n+= v.length?1:0;
        else n++;
      }
      return n;
    },
    set(key, patch){
      const cur=mem[key]||{};
      mem[key]={...cur, ...patch,
        playoffs:{...(cur.playoffs||{}), ...(patch.playoffs||{})},
        waivers:{...(cur.waivers||{}), ...(patch.waivers||{})},
        teams:{...(cur.teams||{}), ...(patch.teams||{})}};
      persist();
    },
    setTeam(key, teamId, patch){
      const cur=mem[key]||{}; const teams={...(cur.teams||{})};
      teams[String(teamId)]={...(teams[String(teamId)]||{}), ...patch};
      mem[key]={...cur, teams}; persist();
    },
    clear(key){ delete mem[key]; persist(); },
    clearAll(){ mem={}; persist(); },
  };
})();

/** The effective override for a league: what was built in, plus local edits. */
function ovFor(l){
  const base=l.overrides||{}, e=edits.forLeague(l.key);
  return {
    ...base, ...e,
    playoffs:{...(base.playoffs||{}), ...(e.playoffs||{})},
    waivers:{...(base.waivers||{}), ...(e.waivers||{})},
    scoring:{...(base.scoring||{}), ...(e.scoring||{})},
    teams:{...(base.teams||{}), ...(e.teams||{})},
    divisions: e.divisions || base.divisions || [],
    myTeamIds: e.myTeamIds || base.myTeamIds || [],
  };
}
const teamLabel = (l, t)=> (ovFor(l).teams[String(t.id)]||{}).nickname || t.name;
const leagueLabel = (l)=> ovFor(l).nickname || l.name;
/** Teams you have claimed here, falling back to whatever the host reported. */
function myTeams(l){
  const o=ovFor(l);
  if(o.myTeamIds && o.myTeamIds.length) return l.teams.filter(t=> o.myTeamIds.map(String).includes(String(t.id)));
  return l.teams.filter(t=>t.mine);
}

/* ---------- roster tables ----------
   Each projection sits above its own positional rank, and the three sources
   (FantasyPros / Vegas / WinWithOdds) are banded together so they read as a set. */

const fmt=(v,d)=> v==null||v===''? '—' : Number(v).toFixed(d==null?1:d);

/**
 * The five projection sources, as they label their own columns.
 *
 * Spelled-out names set the column width from the HEADER rather than from the
 * number underneath, which is backwards: "WinWithOdds" is eleven characters
 * holding up a column whose widest value is four. The abbreviation plus the
 * site's favicon identifies the source in the width a number actually needs,
 * and the full name stays on the cell's tooltip.
 */
const SOURCES = {
  fp:  {ab:'FP',  full:'FantasyPros — expert consensus',        dom:'fantasypros.com'},
  vg:  {ab:'VE',  full:'VegasEdge — sportsbook-derived',        dom:'vegasedgefantasy.com'},
  wwo: {ab:'WWO', full:'WinWithOdds — sportsbook-derived',      dom:'winwithodds.com'},
  fd:  {ab:'1D',  full:'First Down Studio',                     dom:'firstdown.studio'},
  fdl: {ab:'FD',  full:'FanDuel / numberFire',                  dom:'fanduel.com'},
  sl:  {ab:'SL',  full:'Sleeper — published weekly projection, not a ratio', dom:'sleeper.com'},
  ds:  {ab:'DS',  full:'Draft Sharks — weekly rankings, independent of Sleeper', dom:'draftsharks.com'},
};
/** Column width every source column shares. Wide enough for "-12.3". */
const PROJW = 58;

function srcHead(key){
  const s=SOURCES[key];
  const d=el('div','srcth');
  d.append(imgEl('https://www.google.com/s2/favicons?domain='+s.dom+'&sz=32'));
  d.append(el('b',null,s.ab));
  return {node:d, title:s.full};
}
const srcCol = (key) => Object.assign({r:1, w:PROJW}, srcHead(key));

function projBands(scope){
  const h=typeof scope==='object'? scope : null;
  const mode=h? hzMode(h) : scope;
  if(mode==='ros') return [{label:'',span:1},{label: h&&h.kind==='season'?'Full season':'Rest of season',span:6},{label:'Own',span:1}];
  if(mode==='span') return [{label:'',span:1},{label:labelHz(h)+' projections',span:6},{label:'Matchup',span:1},{label:'Own',span:1}];
  return [{label:'',span:1},{label:'Week '+DATA.week+' projections',span:7},{label:'Game',span:1},{label:'Own',span:1}];
}
function projCols(scope){
  const h=typeof scope==='object'? scope : null;
  const mode=h? hzMode(h) : scope;
  const own={label:'%',r:1,sep:1,w:PROJW,title:'Rostered across FantasyPros leagues'};
  if(mode==='ros') return [{label:'Player'},
    Object.assign(srcCol('fp'),{sep:1}), srcCol('wwo'), srcCol('fd'), srcCol('fdl'), srcCol('sl'), srcCol('ds'), own];
  if(mode==='span') return [{label:'Player'},
    Object.assign(srcCol('fp'),{sep:1}), srcCol('wwo'), srcCol('fd'), srcCol('fdl'), srcCol('sl'), srcCol('ds'),
    {label:'Opp',sep:1,w:64,title:'Opponent for the first week in this window'}, own];
  return [{label:'Player'},
    Object.assign(srcCol('fp'),{sep:1}), srcCol('vg'), srcCol('wwo'), srcCol('fd'), srcCol('fdl'), srcCol('sl'), srcCol('ds'),
    {label:'PTS',r:1,sep:1,w:PROJW,title:'Actual points this week, under THIS league\u2019s scoring'}, own];
}
/**
 * One number per source, no second line.
 *
 * Each source used to carry its own kind of subtext — a positional rank here, a
 * delta there, an opponent rank somewhere else — so a row of five columns was
 * five different units stacked under five numbers that ARE the same unit. The
 * projections compare; the subtexts never did. They move to the tooltip, where
 * looking at one does not mean reading all five.
 */
/**
 * This week's actual points, under the LEAGUE's own scoring.
 *
 * `lp` comes off the live board, where MyPlaybook has applied the league's own
 * rule table — so a Sleeper league that takes -2 for an interception is already
 * counted. The WinWithOdds actual is the fallback for a player nobody in the
 * league rosters (he is on no lineup, so the board never saw him), and it is
 * generic PPR: it is marked on the tooltip rather than passed off as the same
 * number, because for a quarterback the two genuinely differ.
 */
function scoredCell(p){
  const td=el('td','r tsep');
  // On the board at all — a slot or a game status means the live fetch saw him,
  // whether or not he has points yet.
  const onBoard = p.lslot!=null || p.lgame!=null;
  const started = !!(p.lgame && p.lgame!=='Not Started');
  const v = onBoard? p.lp : (p.wwo? p.wwo.actual : null);
  // A kickoff that has not happened is not a zero. Falling through to the
  // generic file here printed 0.0 for every player yet to play.
  const show = (onBoard && !started) || v==null ? '—' : fmt(v);
  const d=el('div','scored'+(show==='—'||Number(v)===0? ' zero':'')+(onBoard?'':' approx'));
  d.textContent=show;
  td.append(d);
  td.title = onBoard
    ? (p.lgame||'')+(started? ' \u00b7 this league\u2019s scoring' : ' \u00b7 projected '+fmt(p.lproj))
    : (v==null? 'No actual yet' : fmt(v)+' \u00b7 generic PPR (not on any lineup in this league)');
  return td;
}

/**
 * Look-ahead window. Shared by My Team, Players, All Rosters and Week by Week
 * so a three-week spike is the same number everywhere, not a different toggle
 * on each page.
 *
 * Keys: w-7, n-3 (next 3 from now), p (playoffs 15–17), ros, szn.
 */
const LAST_WEEK=18;
function parseHz(raw){
  const now=DATA.week||1, last=LAST_WEEK;
  const clamp=n=>Math.min(last, Math.max(1, Math.round(Number(n)||1)));
  const s=String(raw||'').trim().toLowerCase();
  if(s==='week') return {kind:'week', from:now, to:now, key:'w-'+now};
  if(s==='ros') return {kind:'ros', from:now, to:last, key:'ros'};
  if(s==='szn'||s==='season') return {kind:'season', from:1, to:last, key:'szn'};
  if(s==='p'||s==='playoffs') return {kind:'playoffs', from:Math.max(now,15), to:Math.min(last,17), key:'p'};
  const w=s.match(/^w-?(\d+)$/);
  if(w){ const n=clamp(w[1]); return {kind:'week', from:n, to:n, key:'w-'+n}; }
  const n=s.match(/^n-?(\d+)$/);
  if(n){ const k=Math.max(1, Number(n[1])); return {kind:'next', n:k, from:now, to:Math.min(last, now+k-1), key:'n-'+k}; }
  const r=s.match(/^r-?(\d+)-(\d+)$/);
  if(r){ let a=clamp(r[1]), b=clamp(r[2]); if(b<a){ const t=a; a=b; b=t; } return {kind:'range', from:a, to:b, key:'r-'+a+'-'+b}; }
  return {kind:'week', from:now, to:now, key:'w-'+now};
}
function hzWeeks(h){ const o=[]; if(!h) return o; for(let w=h.from; w<=h.to; w++) o.push(w); return o; }
function hzMode(h){
  if(!h) return 'week';
  if(h.kind==='ros'||h.kind==='season') return 'ros';
  if(h.kind==='week' && h.from===DATA.week) return 'week';
  return 'span';
}
function labelHz(h){
  if(!h) return '—';
  if(h.kind==='ros') return 'Rest of season';
  if(h.kind==='season') return 'Full season';
  if(h.kind==='playoffs') return 'Playoffs (wk '+h.from+'\u2013'+h.to+')';
  if(h.kind==='week') return 'Week '+h.from;
  if(h.kind==='next') return h.n===1? 'Week '+h.from : 'Next '+h.n+' weeks';
  return 'Weeks '+h.from+'\u2013'+h.to;
}
function hzOptions(){
  const now=DATA.week||1;
  const opts=[{value:'w-'+now, label:'Week '+now+' (this week)'}];
  [2,3,4].forEach(n=>{ if(now+n-1<=LAST_WEEK) opts.push({value:'n-'+n, label:'Next '+n+' weeks'}); });
  if(now<=17) opts.push({value:'p', label:'Playoffs (15–17)'});
  opts.push({value:'ros', label:'Rest of season'}, {value:'szn', label:'Full season'});
  opts.push({value:'', label:'—— Weeks ——', disabled:true});
  for(let w=1; w<=LAST_WEEK; w++) opts.push({value:'w-'+w, label:'Week '+w+(w===now?' · now':'')});
  return opts;
}
function hz(){ return parseHz(horizonKey); }
function setHorizon(v){
  horizonKey=parseHz(v).key;
  store.set('gd.horizon', horizonKey);
  writeHash(); render();
}
function horizonSelect(){
  const wrap=el('label','lbl');
  wrap.style.display='inline-flex'; wrap.style.alignItems='center'; wrap.style.gap='8px';
  wrap.append(document.createTextNode('Window'));
  const s=el('select','hz');
  hzOptions().forEach(o=>{
    const opt=document.createElement('option');
    opt.value=o.value; opt.textContent=o.label; if(o.disabled) opt.disabled=true;
    s.append(opt);
  });
  s.value=horizonKey;
  s.onchange=()=>setHorizon(s.value);
  wrap.append(s);
  return wrap;
}

function teamAbbr(t){
  const x=String(t||'').toUpperCase().replace(/[^A-Z]/g,'');
  return ({JAX:'JAC', WSH:'WAS', LA:'LAR', SD:'LAC', OAK:'LV'})[x] || x;
}
function schedFor(p, w){
  const rec=DATA.schedule && DATA.schedule.teams && DATA.schedule.teams[teamAbbr(p.t)];
  if(!rec) return null;
  if(rec.bye===w) return {bye:true, opp:null, home:null};
  const cell=rec.weeks && (rec.weeks[w]||rec.weeks[String(w)]);
  return cell? {bye:false, opp:cell.opp, home:!!cell.home} : null;
}
function isBye(p, w){
  const s=schedFor(p,w);
  if(s) return !!s.bye;
  if(p.sch && p.sch.bye===w) return true;
  if(p.sl && p.sl.byes && p.sl.byes.indexOf(w)>=0) return true;
  if(p.ds && p.ds.byes && p.ds.byes.indexOf(w)>=0) return true;
  return false;
}
function oppLabel(p, w){
  if(isBye(p,w)) return 'BYE';
  const s=schedFor(p,w);
  if(s && s.opp) return s.home? s.opp : '@'+s.opp;
  if(w===DATA.week && p.opp) return p.opp;
  const ds=(p.ds&&p.ds.crv||[]).find(r=>r[0]===w);
  if(ds && ds[2]) return ds[2];
  const sl=p.sl && p.sl.opp && w===DATA.week? p.sl.opp : null;
  return sl || '—';
}
function ptsFromCrv(crv, w){
  if(!crv) return null;
  const row=crv.find(r=>r[0]===w);
  return row && row[1]!=null? row[1] : null;
}
function shareCurve(crv, fromWeek, source){
  if(!crv || !crv.length) return null;
  const rows=crv.filter(r=>r[0]>=fromWeek && r[1]!=null);
  const total=rows.reduce((a,r)=>a+(r[1]||0),0);
  if(total<=0) return null;
  const share={}, pts={};
  rows.forEach(r=>{ share[r[0]]=(r[1]||0)/total; pts[r[0]]=r[1]||0; });
  return {share, pts, total, weeks:rows.map(r=>r[0]), source};
}
function curveSpread(c){
  if(!c || !c.pts) return 0;
  const vals=Object.values(c.pts).filter(v=>v>0);
  if(vals.length<3) return 0;
  const mean=vals.reduce((a,b)=>a+b,0)/vals.length;
  if(mean<=0) return 0;
  const v=vals.reduce((a,x)=>a+(x-mean)*(x-mean),0)/vals.length;
  return Math.sqrt(v)/mean;
}
/** Draft Sharks when it actually varies week to week; Sleeper if DS is a flat reprint. */
function preferredCurve(p, fromWeek){
  const ds=shareCurve(p.ds&&p.ds.crv, fromWeek, 'ds');
  const sl=shareCurve(p.sl&&p.sl.crv, fromWeek, 'sl');
  const rich=[ds,sl].filter(c=>c && c.weeks && c.weeks.length>=3);
  const shaped=rich.filter(c=>curveSpread(c)>=0.04);
  return shaped[0] || sl || ds || null;
}
function onWeek(total, curve, wk){
  if(total==null || !curve) return null;
  const s=curve.share[wk];
  return s==null? null : Math.round(total*s*100)/100;
}

const ROS_OF = {
  fp:  p=> p.ros,
  wwo: p=> p.wwo && p.wwo.rosDerived,
  fd:  p=> p.fd && p.fd.rosDerived,
  fdl: p=> p.fdl && p.fdl.rosDerived,
  sl:  p=> p.sl && p.sl.ros,
  ds:  p=> p.ds && p.ds.ros,
};
const WEEK_OF = {
  fp:  p=> p.wk,
  wwo: p=> p.wwo && p.wwo.proj,
  fd:  p=> p.fd && p.fd.proj,
  fdl: p=> p.fdl && p.fdl.proj,
  sl:  p=> p.sl && !p.sl.bye && p.sl.wk,
  ds:  p=> p.ds && !p.ds.bye && p.ds.wk,
};
const SEASON_OF = {
  fp:  p=> p.ros!=null? Number(p.ros)+(p.pts||0) : null,
  wwo: p=> p.wwo && p.wwo.seasonProj,
  fd:  p=> p.fd && p.fd.seasonProj,
  fdl: p=> p.fdl && p.fdl.seasonProj,
  sl:  p=> p.sl && p.sl.ros,
  ds:  p=> p.ds && p.ds.ros,
};

/**
 * Published weekly number if the source actually issued one for that week;
 * otherwise a season total spread on Draft Sharks' curve (Sleeper if DS is
 * missing). Sleeper and Draft Sharks are never derived — their cells are
 * the number on the site, or blank.
 */
function weekValue(p, src, wk, curve){
  const mean=a=> Math.round(a.reduce((x,y)=>x+y,0)/a.length*100)/100;
  if(isBye(p,wk)) return {v:null, bye:true};
  if(src==='sl'){
    const v=ptsFromCrv(p.sl&&p.sl.crv, wk);
    if(v!=null) return {v, real:true};
    if(wk===DATA.week && p.sl && p.sl.wk!=null) return {v:p.sl.wk, real:true};
    return {v:null};
  }
  if(src==='ds'){
    const v=ptsFromCrv(p.ds&&p.ds.crv, wk);
    if(v!=null) return {v, real:true};
    if(wk===DATA.week && p.ds && p.ds.wk!=null) return {v:p.ds.wk, real:true};
    return {v:null};
  }
  if(wk===DATA.week){
    if(src!=='bl'){
      const v=WEEK_OF[src] && WEEK_OF[src](p);
      if(v!=null && v!==false) return {v, real:true};
    } else {
      // Blending the published week-N projections, not a blend of
      // redistributed season totals. For the one week every source actually
      // covers, deriving over the top of what they published would be
      // throwing away the better number.
      const pub=['fp','wwo','fd','fdl','sl','ds'].map(k=>WEEK_OF[k](p)).filter(x=>x!=null&&x!==false);
      if(pub.length) return {v:mean(pub), real:true, n:pub.length};
    }
  }
  const c=curve || preferredCurve(p, DATA.week);
  if(src!=='bl') return {v:onWeek(ROS_OF[src](p), c, wk), real:false};
  const pub=[], der=[];
  ['fp','wwo','fd','fdl','sl','ds'].forEach(k=>{
    const r=weekValue(p,k,wk,c);
    if(r.bye || r.v==null) return;
    (r.real? pub : der).push(r.v);
  });
  const vals=pub.length? pub : der;
  if(!vals.length) return {v:null};
  return {v:mean(vals), real:!!pub.length, n:vals.length};
}

function horizonValue(p, src, h){
  if(!h) h=hz();
  if(h.kind==='season' && src!=='bl'){
    const v=SEASON_OF[src] && SEASON_OF[src](p);
    if(v!=null && v!==false) return {v, real:true};
  }
  if((h.kind==='ros'||h.kind==='season') && src!=='bl' && src!=='sl' && src!=='ds'){
    const v=ROS_OF[src] && ROS_OF[src](p);
    if(v!=null && v!==false) return {v, real:h.kind==='ros'};
  }
  const weeks=hzWeeks(h);
  const curve=preferredCurve(p, h.from);
  let tot=0, n=0, real=true, any=false, allBye=true;
  weeks.forEach(w=>{
    const r=weekValue(p, src==='bl'? 'bl' : src, w, curve);
    if(r.bye) return;
    allBye=false;
    if(r.v==null) return;
    any=true; tot+=r.v; n++; if(!r.real) real=false;
  });
  if(allBye && weeks.length) return {v:null, bye:true};
  if(!any){
    if(src==='bl'){
      const vals=['fp','wwo','fd','fdl','sl','ds'].map(k=>horizonValue(p,k,h).v).filter(v=>v!=null);
      if(!vals.length) return {v:null};
      return {v:Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*100)/100, real:false, n:vals.length};
    }
    return {v:null};
  }
  return {v:Math.round(tot*100)/100, real, n};
}

function weekColumns(){
  const h=hz();
  if(h.kind==='ros'||h.kind==='season'||(h.kind==='week'&&h.from===DATA.week)){
    const out=[]; for(let w=DATA.week; w<=LAST_WEEK; w++) out.push(w); return out;
  }
  return hzWeeks(h);
}

      v=>{ store.set('gd.team.'+l.key, v); render(); }));
  }
  bar.append(segmented([{label:'Starting lineup',value:'lineup'},{label:'By position',value:'position'}], teamView, v=>{ teamView=v; store.set('gd.teamView',v); writeHash(); render(); }));
  bar.append(horizonSelect());
  out.push(bar);

  const h=hz();
  if(teamView==='lineup'){
    const lu=lineupFor(l,t);
    const sub = lu.source==='actual' ? 'lineup as set' : (lu.source==='computed' ? 'best-fit lineup (computed)' : 'no slot template');
    out.push(panel('Lineup · '+labelHz(h), sub, lineupTableView(lu, h)));
    if(lu.source==='computed'){
      out.push(Object.assign(el('p','note'),{textContent:
        'This league is not active on FantasyPros, so the lineup you actually set is not available. Slots are filled best-first by projection using the league\u2019s slot template \u2014 treat it as a suggestion, not your saved lineup.'}));
    }
  } else {
    out.push(panel('Roster by position · '+labelHz(h),
      t.players.length+' players', positionTableView(t.players, h)));
  }

  const lg=el('div','legend');
  const mode=hzMode(h);
  lg.innerHTML = mode==='ros'
    ? '<span><b>FP</b> FantasyPros \u00b7 <b>WWO</b> WinWithOdds \u00b7 <b>1D</b> First Down \u00b7 <b>FD</b> FanDuel \u00b7 <b>SL</b> Sleeper \u00b7 <b>DS</b> Draft Sharks.</span>'
      +'<span>The window dropdown is the same on Players and Week by week \u2014 next 3 weeks is a sum of those Sundays, not a rest-of-season total.</span>'
    : '<span><b>FP</b> FantasyPros \u00b7 <b>VE</b> VegasEdge ('+esc(DATA.bookmaker)+') \u00b7 <b>WWO</b> WinWithOdds \u00b7 <b>1D</b> First Down \u00b7 <b>FD</b> FanDuel \u00b7 <b>SL</b> Sleeper \u00b7 <b>DS</b> Draft Sharks.</span>'
      +'<span>Sleeper and Draft Sharks are published weeklies. Other sources for a future week are a season total on the curve that actually varies \u2014 Draft Sharks if a future week moved, Sleeper if Draft Sharks is a flat reprint.</span>'
      +(mode==='week'? '<span><b>PTS</b> scored so far, bold once the game has started.</span>' : '');
  out.push(lg);
  return out;
}

function inactiveNote(l, what){
  return emptyState(what+' needs an active FantasyPros league',
    'FantasyPros serves matchup and standings data only for leagues marked active, and this plan allows '
    + '1 at a time. Activate “'+l.name+'” on FantasyPros (or upgrade) and re-run the sync.');
}

/**
 * The whole league's week, on one board.
 *
 * MyPlaybook's matchup endpoint accepts any teamId, so this works on ESPN and
 * Yahoo as well as Sleeper — neither of which exposes a league scoreboard
 * anywhere else reachable from here. Your own game is marked, not isolated:
 * what a scoreboard is for is seeing everyone else's at once.
 */
function scoreboard(l){
  if(!l.matchups || !l.matchups.ok) return null;
  const mineIds=new Set(myTeams(l).map(t=>String(t.id)));
  const byId=new Map(l.teams.map(t=>[String(t.id),t]));
  const rows=l.matchups.rows.slice().sort((a,b)=>{
    const am=a.sides.some(s=>mineIds.has(String(s.id))), bm=b.sides.some(s=>mineIds.has(String(s.id)));
    return (bm?1:0)-(am?1:0) || (a.final?1:0)-(b.final?1:0);
  });
  const grid=el('div','sbgrid');
  rows.forEach(m=>{
    const card=el('div','sbcard');
    if(m.sides.some(s=>mineIds.has(String(s.id)))) card.classList.add('mine');
    const lead=Math.max(...m.sides.map(s=>s.pts??0));
    const tied=m.sides.length>1 && m.sides[0].pts===m.sides[1].pts;
    m.sides.forEach(s=>{
      const r=el('div','sbrow');
      const t=byId.get(String(s.id));
      r.append(teamAvatar(t? t.logo : s.logo));
      r.append(Object.assign(el('div','sbn'),{textContent: t? teamLabel(l,t) : (s.name||'—')}));
      const pv=el('div','sbp'+((s.pts??0)>=lead && !tied ? ' lead':''));
      pv.textContent=num(s.pts);
      r.append(pv);
      const pj=el('div','sbj'); pj.textContent = s.proj==null? '' : num(s.proj);
      pj.title='projected final';
      r.append(pj);
      card.append(r);
    });
    if(m.sides.length===1) card.append(Object.assign(el('div','sbrow sbbye'),{textContent:'bye'}));
    const foot=el('div','sbfoot');
    foot.append(el('span','pill '+(m.final?'gh':(m.pre?'gh':'q')), m.final? 'final' : (m.pre? 'not started' : (m.minutesLeft!=null? m.minutesLeft+'m left' : 'live'))));
    if(tied && !m.final) foot.append(el('span',null,'tied'));
    card.append(foot);
    grid.append(card);
  });
  const done=l.matchups.rows.filter(m=>m.final).length;
  return panel('Week '+DATA.week+' scoreboard',
    l.matchups.rows.length+' matchups · '+done+' final · every team, from the per-team matchup endpoint', grid);
}

/**
 * Any matchup in the league, not just yours.
 *
 * This used to render one pairing — whichever one MyPlaybook answered for your
 * own teamId — and only for the single league FantasyPros has marked active.
 * The league-wide board already fetches every pairing with every lineup slot
 * (matchups.js asks per team, and the endpoint answers for any of them), so
 * there is no reason the page can only show one. You arrive on yours; the
 * selector and the arrows walk the rest of the league.
 *
 * Points here are the LEAGUE's own: MyPlaybook applies the league's scoring
 * table, so a Sleeper league taking -2 for an interception is already counted.
 * The previous version read actuals out of WinWithOdds' generic PPR file, which
 * is why a quarterback could read high by exactly the interceptions he threw.
 */
function muKey(m){ return m.sides.map(s=>String(s.id)).join('-'); }

function pickMatchup(l){
  const rows=(l.matchups && l.matchups.ok)? l.matchups.rows : [];
  if(!rows.length) return null;
  if(muPick){
    const hit=rows.find(m=> muKey(m)===muPick || m.sides.some(s=>String(s.id)===muPick));
    if(hit) return hit;
  }
  const mine=new Set(myTeams(l).map(t=>String(t.id)));
  return rows.find(m=> m.sides.some(s=>mine.has(String(s.id)))) || rows[0];
}

/** Order the board reads in: yours first, then live, then finished. */
function muOrder(l){
  const rows=(l.matchups && l.matchups.ok)? l.matchups.rows.slice() : [];
  const mine=new Set(myTeams(l).map(t=>String(t.id)));
  return rows.sort((a,b)=>{
    const am=a.sides.some(s=>mine.has(String(s.id))), bm=b.sides.some(s=>mine.has(String(s.id)));
    return (bm?1:0)-(am?1:0) || (a.final?1:0)-(b.final?1:0);
  });
}

function pageMatchup(){
  const l=L(), out=[];
  const h=el('div','head'); h.append(el('h1',null,'Week '+DATA.week+' Matchup'));
  h.append(el('p',null,leagueLabel(l)+' · '+l.host));
  out.push(h);

  const rows=muOrder(l);
  if(!rows.length){
    const M=l.adv&&l.adv.matchup;
    if(M && M.inactive) out.push(panel('Matchup', l.host, inactiveNote(l,'Matchups')));
    else if(l.detail && l.detail.supported) return out.concat(sleeperMatchupFallback(l));
    else out.push(panel('Matchup', l.host, emptyState('No league board yet','Run `node src/cli.js matchups:sync` to pull every pairing in this league.')));
    return out;
  }

  const cur=pickMatchup(l);
  const idx=rows.indexOf(cur);
  const go=(m)=>{ muPick=muKey(m); writeHash(); render(); };

  /* --- pick a pairing ------------------------------------------------- */
  const nav=el('div','munav');
  const prev=el('button','iconbtn','‹'); prev.type='button'; prev.title='Previous matchup';
  prev.onclick=()=>go(rows[(idx-1+rows.length)%rows.length]);
  const next=el('button','iconbtn','›'); next.type='button'; next.title='Next matchup';
  next.onclick=()=>go(rows[(idx+1)%rows.length]);
  nav.append(prev);
  const strip=el('div','mustrip');
  const mineIds=new Set(myTeams(l).map(t=>String(t.id)));
  const byId=new Map(l.teams.map(t=>[String(t.id),t]));
  rows.forEach(m=>{
    const b=el('button','muchip'+(m===cur?' on':'')); b.type='button';
    if(m.sides.some(s=>mineIds.has(String(s.id)))) b.classList.add('mine');
    m.sides.forEach((s,i)=>{
      if(i) b.append(el('span','vs','·'));
      const t=byId.get(String(s.id));
      b.append(teamAvatar(t? t.logo : s.logo));
      b.append(Object.assign(el('span','mc'),{textContent:num(s.pts)}));
    });
    b.title=m.sides.map(s=>{ const t=byId.get(String(s.id)); return (t? teamLabel(l,t) : s.name)+' '+num(s.pts); }).join('  vs  ');
    b.onclick=()=>go(m);
    strip.append(b);
  });
  nav.append(strip); nav.append(next);
  out.push(nav);

  out.push(matchupPanel(l, cur));
  out.push(scoreboard(l));
  return out.filter(Boolean);
}

/** Header, starters and bench for one pairing. */
function matchupPanel(l, m){
  const byId=new Map(l.teams.map(t=>[String(t.id),t]));
  const mineIds=new Set(myTeams(l).map(t=>String(t.id)));
  const [A,B]=m.sides;
  const body=el('div','pbody');

  /* --- head to head --------------------------------------------------- */
  const head=el('div','muhead');
  const sideHead=(s,cls)=>{
    const d=el('div','muteam'+(cls?' '+cls:''));
    const t=s? byId.get(String(s.id)) : null;
    const crest=teamAvatar(t? t.logo : (s&&s.logo));
    const nm=el('div','mun');
    nm.append(el('b',null, t? teamLabel(l,t) : (s&&s.name)||'—'));
    if(t && mineIds.has(String(t.id))) nm.append(el('span','pill ok','you'));
    const sc=el('div','musc');
    sc.append(Object.assign(el('div','p1'),{textContent:num(s? s.pts : null)}));
    const pj=el('div','p2');
    pj.textContent = s&&s.proj!=null? num(s.proj) : '';
    pj.title='projected final';
    sc.append(pj);
    if(cls==='b'){ d.append(sc); d.append(nm); d.append(crest); }
    else { d.append(crest); d.append(nm); d.append(sc); }
    return d;
  };
  head.append(sideHead(A));
  head.append(el('div','muvs', m.final? 'FINAL' : (m.pre? 'VS' : (m.minutesLeft!=null? m.minutesLeft+'m' : 'LIVE'))));
  head.append(sideHead(B,'b'));
  body.append(head);

  // Win probability stays here — it is the one page where a matchup-level
  // number belongs. It was only ever wrong sitting in a standings table.
  if(m.winProb!=null){
    const wp=Math.round(m.winProb*100);
    const w=el('div','wp');
    const bar=el('div','wpbar');
    const a=el('i'); a.style.width=wp+'%'; a.style.background='var(--good)';
    const b=el('i'); b.style.flex='1'; b.style.background='var(--bad)';
    bar.append(a); bar.append(b);
    const nums=el('div','wpnums');
    nums.append(el('span',null,wp+'%'));
    nums.append(el('span',null,'win probability'));
    nums.append(el('span',null,(100-wp)+'%'));
    w.append(bar); w.append(nums);
    body.append(w);
  }

  const panelEl=panel(
    m.final? 'Final' : (m.pre? 'Not started' : 'Live'),
    (m.status||'')+(m.minutesLeft!=null&&!m.final? ' · '+m.minutesLeft+' game minutes left' : ''),
    body);

  if(!B){ body.append(Object.assign(el('p','note'),{textContent:'Bye week — no opponent this week.'})); }
  body.append(muRows(l, A, B, 'starters'));
  const bench=muRows(l, A, B, 'bench');
  if(bench) body.append(bench);
  return panelEl;
}

/**
 * The slot-by-slot rows, laid out as the hosts lay them out: player, his game,
 * his points, the slot badge down the middle, then the same mirrored.
 *
 * The projection sits under the points in the colour of the gap, so a row
 * answers "is he beating his number" without a second column to read.
 */
function muRows(l, A, B, which){
  const a=(A&&A[which])||[], b=(B&&B[which])||[];
  if(!a.length && !b.length) return null;
  const wrap=el('div','muslots'+(which==='bench'?' bench':''));
  if(which==='bench') wrap.append(Object.assign(el('div','muband'),{textContent:'Bench'}));

  const byFp=new Map();
  l.teams.forEach(t=> t.players.forEach(p=> byFp.set(p.i,p)));

  const cell=(p,cls)=>{
    const d=el('div','muside'+(cls?' '+cls:''));
    if(!p){ d.append(el('span','note','—')); return d; }
    const en=byFp.get(p.i) || {i:p.i, n:p.n, t:p.t, p:p.pos, s:null};
    const who=el('div','muwho');
    who.append(avatarFor({p:p.pos||en.p, t:p.t||en.t, s:en.s}));
    const nm=el('div','munm');
    const line1=el('div','l1');
    line1.append(el('b',null,p.n||'—'));
    if(p.t) line1.append(el('span','tm',p.t));
    const ip=injPill({inj:p.inj}); if(ip) line1.append(ip);
    nm.append(line1);
    const line2=el('div','l2');
    line2.textContent = p.score || p.game || p.opp || '';
    nm.append(line2);
    who.append(nm);

    const val=el('div','muval');
    const played = p.pts!=null && !p.pre;
    const pv=el('div','pv'+(played?'':' dim'));
    pv.textContent = played? num(p.pts) : '—';
    val.append(pv);
    /**
     * The second line is the projection the points should be read against —
     * and which projection that is depends on whether the game has been played.
     *
     * Once it is over, the live-adjusted number has converged on the actual, so
     * printing it puts the same figure twice on the row. What is worth knowing
     * then is what he was PROJECTED before kickoff, coloured by the gap. While
     * a game is running the live projected final is the useful one.
     */
    const sub=el('div','pj');
    const done = p.over || (p.pts!=null && p.min===0);
    const shown = done? (p.proj0!=null? p.proj0 : p.proj) : p.proj;
    if(shown!=null){
      sub.textContent=num(shown);
      if(done && p.pts!=null){
        const gap=p.pts-shown;
        sub.style.color = gap>=0? 'var(--good)' : 'var(--bad)';
        sub.title='projected '+num(shown)+' pre-game · '+(gap>=0?'+':'')+num(gap);
      } else {
        sub.title='projected final';
      }
    }
    val.append(sub);

    if(cls==='b'){ d.append(val); d.append(who); }
    else { d.append(who); d.append(val); }
    return d;
  };

  const n=Math.max(a.length,b.length);
  for(let i=0;i<n;i++){
    const L=a[i], R=b[i];
    const row=el('div','murow');
    row.append(cell(L));
    const mid=el('div','mumid');
    mid.append(posChip((L&&L.slot)||(R&&R.slot)||(which==='bench'?'BN':'—'),'slot'));
    row.append(mid);
    row.append(cell(R,'b'));
    wrap.append(row);
  }

  if(which==='starters'){
    /**
     * The totals are the HOST's, not the sum of the rows above them.
     *
     * On most leagues they are the same number. On one Yahoo league they are
     * not: MyPlaybook's per-player scoring comes out 1–3 points above what
     * Yahoo itself reports for the team, on five teams out of twelve. The team
     * score is the host's own live figure and the one the scoreboard and
     * standings use, so it is the one that belongs here — and where the parts
     * disagree with it, the row says so rather than quietly printing a third
     * number the league has never seen.
     */
    const row=el('div','murow mutot');
    const mk=(side,list,cls)=>{
      const d=el('div','muside'+(cls?' '+cls:''));
      const v=el('div','muval');
      const host = side? side.pts : null;
      v.append(Object.assign(el('div','pv'),{textContent:num(host)}));
      v.append(Object.assign(el('div','pj'),{textContent: side&&side.proj!=null? num(side.proj) : ''}));
      const parts = sum(list.filter(p=>p.pts!=null&&!p.pre), p=>p.pts);
      if(host!=null && Math.abs(parts-host)>0.05){
        const flag=Object.assign(el('div','ss'),{textContent:'rows sum '+num(parts)});
        flag.style.color='var(--warn)';
        flag.title='MyPlaybook\u2019s per-player scoring for this league sums to '+num(parts)
          +', '+num(Math.abs(parts-host))+' '+(parts>host?'above':'below')+' the '+l.host
          +' team score. The team score is the host\u2019s own and is what the scoreboard and standings use.';
        v.append(flag);
      }
      if(cls==='b'){ d.append(v); } else { d.append(el('span','grow')); d.append(v); }
      return d;
    };
    row.append(mk(A,a));
    const mid=el('div','mumid'); mid.append(el('span','wk','STARTERS')); row.append(mid);
    row.append(mk(B,b,'b'));
    wrap.append(row);
  }
  return wrap;
}

/* Sleeper still fills in when MyPlaybook has no active-league access. */
function sleeperMatchupFallback(l){
  const out=[];
  const t=myTeam();
  const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  const mine=t? l.detail.standings.find(s=>norm(s.name)===norm(t.name)) : null;
  const mu=mine? l.detail.matchups.find(m=>m.sides.some(s=>s.rosterId===mine.rosterId)) : l.detail.matchups[0];
  if(!mu||mu.sides.length<2){ out.push(panel('Matchup',null,emptyState('No pairing posted','Sleeper has not published a week '+DATA.week+' matchup.'))); return out; }
  const projOf=name=>{ const team=l.teams.find(x=>norm(x.name)===norm(name)); return team? sum(team.players,p=>p.wk) : null; };
  const body=el('div','pbody'); const head=el('div','muhead');
  const side=(s,cls)=>{
    const d=el('div','muteam'+(cls?' '+cls:''));
    const crest=teamAvatar(s.avatar||null);
    const nm=el('div','mun'); nm.append(el('b',null,s.team));
    const sc=el('div','musc');
    sc.append(Object.assign(el('div','p1'),{textContent:num(s.points)}));
    const pj=projOf(s.team);
    sc.append(Object.assign(el('div','p2'),{textContent: pj==null? 'live' : num(pj)}));
    if(cls==='b'){ d.append(sc); d.append(nm); d.append(crest); } else { d.append(crest); d.append(nm); d.append(sc); }
    return d;
  };
  head.append(side(mu.sides[0])); head.append(el('div','muvs','VS')); head.append(side(mu.sides[1],'b'));
  body.append(head);
  body.append(Object.assign(el('p','note'),{textContent:'Sleeper\u2019s own live scoring. Run `node src/cli.js matchups:sync` for the full slot-by-slot board and every other pairing in the league.'}));
  out.push(panel('Head to head','Sleeper live scoring',body));
  mu.sides.forEach(s=>{ const team=l.teams.find(x=>norm(x.name)===norm(s.team)); if(team) out.push(panel(s.team,'projected '+num(sum(team.players,p=>p.wk)),rosterTable(team.players))); });
  return out;
}

/**
 * One standings table, whatever the host is.
 *
 * Every column below is filled from whichever source has it, and a column
 * nobody has is dropped rather than rendered empty.
 *
 *   logo, name      the rosters payload, which carries a logo for ALL THREE
 *                   hosts.
 *   record, rank    MyPlaybook projected-standings — works for every host.
 *   playoff odds    same source, same coverage.
 *   PF / PA         every FINISHED matchup this app has stored, with the game
 *                   count carried so a row over one game never reads as a
 *                   season.
 *   this week       the live board, for every host, with the projected final.
 *   waiver / FAAB   Sleeper only. Nothing else exposes it.
 *
 * WHAT COUNTS TOWARDS THE RECORD
 *
 * `standMode` decides, and it defaults to `done`:
 *
 *   done   the host's official record, plus any matchup THIS WEEK that has
 *          actually finished. A game in progress moves nothing — the table
 *          does not reorder itself while you watch a game.
 *   proj   also counts unfinished games to whoever is ahead, and games not
 *          yet kicked off to whoever is projected higher. "Assume the
 *          favourites hold."
 *
 * Either way the rank is the standard one: record first, then points for. The
 * league's seeding rule colours which rows are in, it does not renumber them —
 * a seed is an answer to a different question than "who is first".
 */
function standingsRows(l){
  const P = l.adv && l.adv.standings;
  const proj = (P && P.ok) ? P.standings : [];
  const projById = new Map(proj.map(r=>[String(r.teamId), r]));
  const detail = (l.detail && l.detail.supported) ? l.detail.standings : [];
  const norm = (x)=> String(x||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  const detailByName = new Map(detail.map(d=>[norm(d.name), d]));

  // This week's score, keyed both ways so a bye still resolves.
  const liveById = new Map();
  if(l.matchups && l.matchups.ok){
    l.matchups.rows.forEach(m=>{
      const [a,b]=m.sides;
      const put=(self,opp)=>{ if(self && self.id!=null) liveById.set(String(self.id), {self,opp,m}); };
      put(a,b); put(b,a);
    });
  }

  const rows = l.teams.map(t=>{
    const id=String(t.id);
    const pr = projById.get(id) || null;
    const dt = detailByName.get(norm(t.name)) || detailByName.get(norm(t.nameScraped)) || null;
    const live = liveById.get(id) || null;
    const acc = t.totals || null;

    const wins = pr?.winsCurrent ?? dt?.wins ?? 0;
    const losses = pr?.lossesCurrent ?? dt?.losses ?? 0;
    const ties = pr?.tiesCurrent ?? dt?.ties ?? 0;

    let wkResult = null, addW = 0, addL = 0, addT = 0, provisional = false;
    if(live && live.opp){
      const gap = (live.self.pts??0) - (live.opp.pts??0);
      // Pre-game has no points to compare, so the favourite is the projection.
      const pgap = (live.self.proj??live.self.pts??0) - (live.opp.proj??live.opp.pts??0);
      wkResult = { final: live.m.final, pre: live.m.pre, gap, win: gap>0, tie: gap===0,
                   pts: live.self.pts, proj: live.self.proj,
                   oppPts: live.opp.pts, oppProj: live.opp.proj, opp: live.opp.name, m: live.m };
      if(live.m.final){
        if(gap>0) addW=1; else if(gap<0) addL=1; else addT=1;
      } else if(standMode==='proj'){
        const g = live.m.pre? pgap : gap;
        if(g>0) addW=1; else if(g<0) addL=1; else addT=1;
        provisional = true;
      }
    } else if(live){
      wkResult = { final: live.m.final, pre: live.m.pre, bye:true, pts: live.self.pts, proj: live.self.proj, m: live.m };
    }

    /**
     * Points for and against.
     *
     * The ledger — every finished matchup this app has stored — is preferred
     * because it is the only one that exists for ESPN and Yahoo. A host total
     * of exactly zero with no games played is absent data wearing a number's
     * clothes, so it is read as absent.
     */
    const hostPf = (dt && (dt.pointsFor || dt.pointsAgainst)) ? dt : null;
    const useAcc = acc && acc.games;
    let pointsFor = useAcc? acc.pointsFor : (hostPf? hostPf.pointsFor : null);
    let pointsAgainst = useAcc? acc.pointsAgainst : (hostPf? hostPf.pointsAgainst : null);
    let games = useAcc? acc.games : null;
    // In `proj` mode the record already counts the game in progress, so the
    // points columns have to count it too — a record and a points total that
    // disagree about which games happened is worse than either alone.
    if(standMode==='proj' && live && !live.m.final && !live.m.pre){
      pointsFor = (pointsFor||0) + (live.self.pts||0);
      if(live.opp) pointsAgainst = (pointsAgainst||0) + (live.opp.pts||0);
      games = (games||0) + 1;
    }

    return {
      team: t, id,
      name: teamLabel(l,t),
      // Under a nickname, the subtext is what the host actually calls the team;
      // the owner's username follows it where the host gives one.
      sub: [ (ovFor(l).teams[id]||{}).nickname ? t.name : null, dt?.owner || null ].filter(Boolean).join(' · ') || null,
      logo: t.logo,
      hostRank: pr?.rankCurrent ?? dt?.rank ?? null,
      rankProj: pr?.rankProjected ?? null,
      wins, losses, ties,
      effWins: wins+addW, effLosses: losses+addL, effTies: ties+addT,
      counted: !!(addW||addL||addT),
      provisional,
      projRecord: pr ? [pr.winsProjected, pr.lossesProjected] : null,
      odds: pr?.playoffOdds ?? null,
      oddsPct: (()=>{ const n=parseInt(String(pr?.playoffOdds||'').replace('%',''),10); return isNaN(n)?null:n; })(),
      pointsFor: pointsFor==null? null : Number(pointsFor.toFixed(2)),
      pointsAgainst: pointsAgainst==null? null : Number(pointsAgainst.toFixed(2)),
      games,
      pfSource: useAcc? 'ledger' : (hostPf? 'host' : null),
      waiverPosition: dt?.waiverPosition ?? null,
      waiverBudgetUsed: dt?.waiverBudgetUsed ?? null,
      totalMoves: dt?.totalMoves ?? null,
      streak: dt?.streak ?? null,
      wkResult,
      wkPts: live? (live.self.pts ?? null) : null,
      rank: null, seed: null, seedWhy: null, inPlayoffs: null,  // filled below
      mine: !!t.mine,
      division: t.division ?? null,
    };
  });

  // Games back from the leader, on the record as counted.
  const lead = rows.reduce((a,r)=> (r.effWins - r.effLosses) > (a.effWins - a.effLosses) ? r : a, rows[0] || {effWins:0,effLosses:0});
  rows.forEach(r=>{ r.gb = ((lead.effWins - r.effWins) + (r.effLosses - lead.effLosses)) / 2; });

  /**
   * The standard rank: record, then points for. Every league, same rule.
   *
   * This used to be the seed where a seeding rule existed, which conflated two
   * things — a division winner can be seeded first from fourth place, and the
   * table then numbered them 1 while the record said otherwise. The seed still
   * decides who is IN, and is on the tooltip; the number is the plain standing.
   */
  rows.slice().sort(byStandard).forEach((r,i)=>{ r.rank=i+1; });

  applySeeds(rows, l);

  // With no rule configured, "in the playoffs" is simply the top N.
  if(!rows.some(r=>r.seed!=null)){
    const n = (l.playoffs && l.playoffs.teams) || null;
    if(n) rows.forEach(r=>{ r.inPlayoffs = r.rank<=n; });
  }
  return rows;
}

/** Record first, then points for — the ordering every league agrees on. */
function byStandard(a,b){
  return (b.effWins-a.effWins) || (a.effLosses-b.effLosses) || (b.effTies-a.effTies)
      || (b.pointsFor??0)-(a.pointsFor??0)
      || (b.wkPts??0)-(a.wkPts??0)
      || String(a.name).localeCompare(String(b.name));
}

/**
 * Playoff seeds, under this league's own rule, on these rows.
 *
 * The same three rules the CLI and League Setup speak, applied to the merged
 * rows rather than to one host's standings — so it works on ESPN and Yahoo,
 * and so the bracket and the table agree about this week.
 *
 * Rows are mutated rather than returned because every caller wants them
 * attached to the team they belong to, and a parallel array would be one more
 * thing to keep aligned.
 */
function applySeeds(rows, l){
  const cfg = l.seedRule;
  if(!cfg || !cfg.rule || !rows.length) return;
  const tb = cfg.tiebreak || 'pointsFor';
  const byRecord = tb==='pointsAgainst'
    ? (a,b)=> (b.effWins-a.effWins) || (a.effLosses-b.effLosses) || (a.pointsAgainst ?? Infinity)-(b.pointsAgainst ?? Infinity)
    : byStandard;
  const n = cfg.playoffTeams ?? rows.length;
  let ordered;

  if(cfg.rule==='division-first'){
    const locked = cfg.divisionSeeds ?? 2;
    const best=new Map();
    rows.forEach(r=>{
      const d=r.division ?? '_none';
      if(!best.has(d) || byRecord(r,best.get(d))<0) best.set(d,r);
    });
    const winners=[...best.values()].filter(r=>r.division).sort(byRecord).slice(0,locked);
    const w=new Set(winners);
    ordered=[...winners.map(r=>({r,why:'division winner'})),
             ...rows.filter(r=>!w.has(r)).sort(byRecord).map(r=>({r,why:'record'}))];
  } else if(cfg.rule==='points-wildcard'){
    const wc = cfg.wildcards ?? 1;
    const auto = rows.slice().sort(byRecord).slice(0, Math.max(0, n-wc));
    const a=new Set(auto);
    // The wildcard is decided on points alone, among everyone who missed.
    const wild = rows.filter(r=>!a.has(r))
      .sort((x,y)=> (y.pointsFor ?? y.wkPts ?? 0)-(x.pointsFor ?? x.wkPts ?? 0)).slice(0,wc);
    const wset=new Set(wild);
    ordered=[...auto.map(r=>({r,why:'record'})),
             ...wild.map(r=>({r,why:'points wildcard'})),
             ...rows.filter(r=>!a.has(r)&&!wset.has(r)).sort(byRecord).map(r=>({r,why:'missed'}))];
  } else {
    ordered=rows.slice().sort(byRecord).map(r=>({r,why:'record'}));
  }

  ordered.forEach(({r,why},i)=>{ r.seed=i+1; r.seedWhy=why; r.inPlayoffs = i<n; });
}

/* ---------- sortable tables ---------- */

const STAND_SORTS = {
  rank:   { label:'#',        of:(r)=> r.rank ?? 99, dir:1 },
  name:   { label:'Team',     of:(r)=> r.name.toLowerCase(), dir:1, text:1 },
  record: { label:'Record',   of:(r)=> (r.effWins - r.effLosses)*1000 + (r.pointsFor ?? 0), dir:-1 },
  gb:     { label:'GB',       of:(r)=> r.gb, dir:1 },
  pf:     { label:'PF',       of:(r)=> r.pointsFor ?? -1, dir:-1 },
  pa:     { label:'PA',       of:(r)=> r.pointsAgainst ?? Infinity, dir:1 },
  week:   { label:'Week',     of:(r)=> r.wkPts ?? -1, dir:-1 },
  odds:   { label:'Odds',     of:(r)=> r.oddsPct ?? -1, dir:-1 },
  div:    { label:'Division', of:(r)=> String(r.division||'~'), dir:1, text:1 },
  waiver: { label:'Waiver',   of:(r)=> r.waiverPosition ?? 99, dir:1 },
};

function sortRows(rows, key, flip){
  const s = STAND_SORTS[key] || STAND_SORTS.rank;
  const d = (s.dir || 1) * (flip ? -1 : 1);
  return rows.slice().sort((a,b)=>{
    const x=s.of(a), y=s.of(b);
    // Equal values fall back to the standard order rather than to whatever the
    // roster list happened to be in.
    if(x===y) return byStandard(a,b);
    if(s.text) return String(x).localeCompare(String(y))*d;
    return (x<y? -1 : 1)*d;
  });
}

/** A header cell that sorts the table when clicked. */
function sortTh(col, active, flip, onSort){
  const th=el('th',(col.r?'r':'')+(col.sep?' tsep':'')+' sortable'+(col.key===active?' sorted':''));
  const w=el('span','sorth');
  w.append(document.createTextNode(col.label));
  if(col.key===active) w.append(el('span','arrow', flip? '▲' : '▼'));
  th.append(w);
  if(col.title) th.title=col.title;
  if(col.key){ th.onclick=()=>onSort(col.key); th.style.cursor='pointer'; }
  return th;
}

function sortableTable(cols, rows, {sortKey, flip, onSort}={}){
  const wrap=el('div','scroll');
  const t=el('table','fixed stand');
  const cg=el('colgroup');
  cols.forEach(c=>{ const co=el('col'); if(c.w) co.style.width=c.w+'px'; cg.append(co); });
  t.append(cg);
  const thead=el('thead'); const hr=el('tr');
  cols.forEach(c=> hr.append(sortTh(c, sortKey, flip, onSort)));
  thead.append(hr); t.append(thead);
  const tb=el('tbody'); rows.forEach(r=>tb.append(r)); t.append(tb);
  wrap.append(t); return wrap;
}
