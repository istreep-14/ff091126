function teamCell(r){
  const td=el('td');
  const w=el('div','pl');
  w.append(teamAvatar(r.logo));
  const n=el('div','nm');
  n.append(el('b',null,r.name));
  const bits=[r.sub, r.streak? 'streak '+r.streak : null].filter(Boolean);
  if(bits.length) n.append(el('small',null,bits.join(' · ')));
  w.append(n); td.append(w);
  return td;
}
/** Fantasy-team crests: square, uncropped, never zoomed like a headshot. */
function teamAvatar(src){
  const box=el('span','tav');
  box.append(imgEl(src));
  return box;
}

/**
 * This week: what they have scored, over what they are on track to finish with.
 *
 * The projection is the point of the column during a live week — the score
 * alone says nothing about whether a team with four players left is ahead.
 * MyPlaybook's own figure is used, which already counts banked points plus the
 * remaining projections rather than re-projecting the whole roster.
 */
function weekCell(r){
  const td=el('td','r');
  if(!r.wkResult){ td.append(el('span','note','—')); return td; }
  const k=r.wkResult;
  const d=el('div','stack');
  const v=el('div','sv');
  v.textContent = k.pre && k.pts==null? '—' : num(k.pts);
  if(!k.bye && !k.pre){
    v.style.color = k.tie? 'var(--ink-2)' : (k.win? 'var(--good)' : 'var(--bad)');
    if(k.final) v.style.fontWeight='700';
  }
  d.append(v);
  const proj = k.proj==null? null : num(k.proj);
  const sub = k.bye ? (k.final? 'bye' : 'bye · proj '+(proj||'—'))
    : k.pre ? 'proj '+(proj||'—')
    : k.final ? (k.tie? 'tied' : (k.win? 'W ' : 'L ')+num(Math.abs(k.gap)))
    : 'proj '+(proj||'—')+' · '+(k.tie?'tied':(k.win?'up ':'down ')+num(Math.abs(k.gap)));
  d.append(Object.assign(el('div','ss'),{textContent:sub}));
  td.append(d);
  if(!k.bye){
    td.title='vs '+k.opp+' '+num(k.oppPts)+(k.oppProj!=null? ' (proj '+num(k.oppProj)+')':'')
      +' · '+(k.final?'final':(k.pre?'not started':(k.m.minutesLeft??'?')+'m of game time left'));
  }
  return td;
}

function pageStandings(){
  const l=L(), out=[];
  const h=el('div','head'); h.append(el('h1',null,'Standings'));
  h.append(el('p',null,leagueLabel(l)+' · '+l.host+' · '+l.teams.length+' teams'));
  out.push(h);

  const rows=standingsRows(l);
  const divisions=[...new Set(rows.map(r=>r.division).filter(Boolean))].sort();
  const anyPf=rows.some(r=>r.pointsFor!=null);
  const anyOdds=rows.some(r=>r.oddsPct!=null);
  const anyWaiver=rows.some(r=>r.waiverPosition!=null || r.waiverBudgetUsed!=null);
  const anyWeek=rows.some(r=>r.wkResult);
  const anySeed=rows.some(r=>r.seed!=null);
  const anyLive=rows.some(r=>r.wkResult && !r.wkResult.final);

  const bar=el('div','toggles');
  if(divisions.length>1){
    bar.append(segmented([{label:'Whole league',value:'all'},{label:'By division',value:'division'}], standView,
      v=>{ standView=v; store.set('gd.standView',v); writeHash(); render(); }));
  }
  if(anyLive){
    // The record does not move while a game is being played. This is the opt-in
    // to the other reading — "if everyone ahead right now holds on".
    bar.append(segmented([{label:'Completed games',value:'done'},{label:'If leaders hold',value:'proj'}], standMode,
      v=>{ standMode=v; store.set('gd.standMode',v); writeHash(); render(); }));
  }
  if(bar.childNodes.length) out.push(bar);

  const budget = l.faabBudget ?? (l.detail&&l.detail.supported? l.detail.settings.waiverBudget : null);
  const maxGames = rows.reduce((a,r)=>Math.max(a, r.games||0), 0);

  // Every column carries a width, including the name. Under fixed layout the
  // leftover is then shared out proportionally; leaving the name column
  // unsized handed it every spare pixel and crushed the numbers against the
  // right edge.
  const cols=[
    {key:'rank',   label:'#',       r:1, w:46, title:'Record, then points for'},
    {key:'name',   label:'Team',    w:250},
    {key:'record', label:'Record',  r:1, w:72, title: standMode==='proj'
        ? 'Official record plus every game this week, counted to whoever is ahead'
        : 'Official record plus this week’s finished games only'},
  ];
  if(anyPf) cols.push(
    {key:'pf', label:'PF', r:1, w:72, title:'Points for, over '+maxGames+' finished game(s)'},
    {key:'pa', label:'PA', r:1, w:72, title:'Points against, over the same games'});
  if(divisions.length && standView!=='division') cols.push({key:'div', label:'Division', w:104});
  cols.push({key:'gb', label:'GB', r:1, w:46, title:'Games back of the leader'});
  if(anyOdds) cols.push({key:'odds', label:'Playoff %', r:1, w:78, title:'MyPlaybook projected playoff odds'});
  if(anyWeek) cols.push({key:'week', label:'Week '+DATA.week, r:1, w:88, title:'Scored so far, over the projected final'});
  if(anyWaiver) cols.push({key:'waiver', label:'Waiver', r:1, w:76, title:budget? 'Claim order, and FAAB remaining' : 'Claim order'});

  const onSort=(k)=>{
    if(standSort===k) standFlip=!standFlip; else { standSort=k; standFlip=false; }
    store.set('gd.standSort',standSort); store.set('gd.standFlip',standFlip?'1':'');
    writeHash(); render();
  };

  const buildRow=(r)=>{
    const tr=el('tr');
    if(r.mine) tr.classList.add('mine');
    // In vs out is a fill, not just a line: sorting by points-for or by
    // division breaks rank order, and a divider drawn at a fixed row index
    // would then sit in the wrong place while still looking authoritative.
    if(r.inPlayoffs===true) tr.classList.add('inplay');
    else if(r.inPlayoffs===false) tr.classList.add('outplay');

    const rk=el('td','r');
    const badge=el('span','seedno'+(r.inPlayoffs?' in':''), String(r.rank));
    badge.title=[
      'Standing #'+r.rank+' by record, then points for',
      r.seed!=null? 'Playoff seed '+r.seed+' — '+r.seedWhy : null,
      r.hostRank!=null && r.hostRank!==r.rank? l.host+' has them #'+r.hostRank : null,
    ].filter(Boolean).join('\n');
    rk.append(badge);
    // The seed only earns its own mark when it disagrees with the standing.
    if(r.seed!=null && r.seed!==r.rank) rk.append(el('span','seedalt','#'+r.seed));
    tr.append(rk);

    tr.append(teamCell(r));

    const rec=el('td','r');
    const rd=el('div','stack');
    const rv=el('div','sv'+(r.provisional?' prov':''));
    rv.textContent=r.effWins+'-'+r.effLosses+(r.effTies?'-'+r.effTies:'');
    rd.append(rv);
    if(r.counted) rd.append(Object.assign(el('div','ss'),{textContent:r.wins+'-'+r.losses+' official'}));
    rec.append(rd);
    if(r.counted) rec.title=(r.provisional? 'Counts a game still in progress. ':'')+'Official record is '+r.wins+'-'+r.losses+'.';
    tr.append(rec);

    if(anyPf){
      const mk=(v,g)=>{
        const td=el('td','r');
        const d=el('div','stack');
        d.append(Object.assign(el('div','sv'),{textContent: v==null? '—' : num(v)}));
        // Only the rows that are over fewer games than the rest say so; on a
        // table where everyone has played the same number it is just noise.
        if(v!=null && g!=null && g<maxGames) d.append(Object.assign(el('div','ss'),{textContent:g+' gm'}));
        td.append(d);
        if(v!=null && g) td.title=num(v)+' over '+g+' finished game'+(g>1?'s':'');
        return td;
      };
      tr.append(mk(r.pointsFor, r.games));
      tr.append(mk(r.pointsAgainst, r.games));
    }

    if(divisions.length && standView!=='division'){
      const dv=el('td');
      if(r.division) dv.append(el('span','pill gh', r.division));
      else dv.append(el('span','note','—'));
      tr.append(dv);
    }

    tr.append(Object.assign(el('td','r num'),{textContent: r.gb===0? '—' : (Number.isInteger(r.gb)? String(r.gb) : r.gb.toFixed(1))}));
    if(anyOdds){
      const od=el('td','r');
      if(r.oddsPct==null) od.append(el('span','note','—'));
      else{
        const sp=el('span','num odds');
        sp.textContent=r.oddsPct+'%';
        sp.style.color = r.oddsPct>=70? 'var(--good)' : (r.oddsPct>=35? 'var(--market)' : 'var(--bad)');
        od.append(sp);
      }
      if(r.projRecord) od.title='Projected finish '+r.projRecord[0]+'-'+r.projRecord[1]+' (#'+(r.rankProj??'—')+')';
      tr.append(od);
    }
    if(anyWeek) tr.append(weekCell(r));
    if(anyWaiver){
      const wv=el('td','r');
      const d=el('div','stack');
      d.append(Object.assign(el('div','sv'),{textContent: r.waiverPosition==null? '—' : '#'+r.waiverPosition}));
      if(r.waiverBudgetUsed!=null && budget) d.append(Object.assign(el('div','ss'),{textContent:'$'+(budget-r.waiverBudgetUsed)}));
      else if(r.totalMoves!=null) d.append(Object.assign(el('div','ss'),{textContent:r.totalMoves+' mv'}));
      wv.append(d); tr.append(wv);
    }
    return tr;
  };

  const cutIndex = rows.filter(r=>r.inPlayoffs).length || null;

  if(standView==='division' && divisions.length>1){
    divisions.forEach(dv=>{
      const sub=sortRows(rows.filter(r=>r.division===dv), standSort, standFlip);
      out.push(panel(dv, sub.length+' teams', sortableTable(cols, sub.map(buildRow), {sortKey:standSort, flip:standFlip, onSort})));
    });
    const none=rows.filter(r=>!r.division);
    if(none.length){
      const sub=sortRows(none, standSort, standFlip);
      out.push(panel('No division', none.length+' teams · assign them in League Setup',
        sortableTable(cols, sub.map(buildRow), {sortKey:standSort, flip:standFlip, onSort})));
    }
  } else {
    const sorted=sortRows(rows, standSort, standFlip);
    // The cut line is only drawn when the current sort actually puts the
    // qualifying teams on top; otherwise the fill carries it alone.
    const clean = cutIndex!=null && sorted.every((r,i)=> (i<cutIndex) === (r.inPlayoffs===true));
    const trs=[];
    sorted.forEach((r,i)=>{
      if(clean && i===cutIndex){
        const cut=el('tr','cutrow');
        const td=el('td'); td.colSpan=cols.length;
        td.append(el('span',null,'playoff cut · top '+cutIndex+(anySeed?' by this league’s rule':'')));
        cut.append(td); trs.push(cut);
      }
      trs.push(buildRow(r));
    });
    out.push(panel('Standings', standingsSource(l, rows, maxGames), sortableTable(cols, trs, {sortKey:standSort, flip:standFlip, onSort})));
  }

  const notes=[];
  notes.push('Ranked on record, then points for. '+(anySeed
    ? 'Shaded rows are in under this league’s own rule — '+(l.seedRule.describe||'')+' A seed that differs from the standing is marked beside the number.'
    : (cutIndex? 'Shaded rows are the top '+cutIndex+'. Set a seeding rule in League Setup to mark them under your league’s actual rule.' : '')));
  notes.push(standMode==='proj'
    ? 'Records count every game this week to whoever is currently ahead, or projected higher before kickoff.'
    : 'Records change only when a game finishes — a matchup in progress does not move the table.');
  if(!anyPf) notes.push('Points for and against appear as soon as a matchup finishes; none has yet this week.');
  else if(rows.some(r=>r.pfSource==='ledger')) notes.push('Points are summed over every finished matchup this app has stored'
    +(standMode==='proj'? ', plus this week as it currently stands' : '')
    +' ('+maxGames+' game(s)) — neither ESPN nor Yahoo publishes a season total anywhere reachable, so weekly syncs are what build it.');
  notes.filter(Boolean).forEach(n=> out.push(Object.assign(el('p','note'),{textContent:n})));

  const P=l.adv&&l.adv.standings;
  if(P && !P.ok && P.inactive) out.push(inactiveNote(l,'Projected standings'));
  return out;
}

function standingsSource(l, rows, maxGames){
  const bits=[];
  if(rows.some(r=>r.hostRank!=null)) bits.push('records from MyPlaybook');
  if(rows.some(r=>r.wkResult)) bits.push('live scores from all '+l.teams.length+' teams');
  if(rows.some(r=>r.pointsFor!=null)) bits.push('points over '+maxGames+' finished game'+(maxGames===1?'':'s'));
  if(rows.some(r=>r.waiverPosition!=null)) bits.push('waivers from '+l.host);
  return bits.join(' · ') || l.host;
}

/* ---------- waiver clock ----------
 *
 * "Is he a free agent or a waiver claim?" is a different question from "is he
 * unrostered", and it changes what you do: a free agent is first-come, a
 * waiver player costs a claim and processes on a schedule.
 *
 * No host exposes a per-player waiver state through anything reachable here.
 * It is derivable, though, from two things we do have: the drop that put him
 * there (transactions carry the date, and `viaWaivers` on the URL), and the
 * league's own claim period and process day, which you set in League Setup.
 *
 * When the period is not configured this returns null rather than guessing —
 * an invented clear time would be read as fact.
 */
const DAY_MS = 86400000;

function waiverClock(l){
  const o = ovFor(l);
  const w = o.waivers || {};
  const days = w.claimDays;
  const type = (w.type || l.waiverType || '').toLowerCase();
  if (type === 'none') return { configured:true, none:true, byPlayer:new Map() };
  if (days == null && w.processDay == null) return { configured:false, byPlayer:new Map() };

  // Most recent drop per player, across the whole league.
  const dropped = new Map();
  for (const t of l.transactions || []) {
    for (const d of t.drops || []) {
      const at = t.time ? new Date(t.time) : (t.date ? new Date(t.date) : null);
      if (!at || Number.isNaN(at.getTime())) continue;
      const prev = dropped.get(d.fpId);
      if (!prev || at > prev.at) dropped.set(d.fpId, { at, teamName: t.teamName });
    }
  }

  const now = new Date();
  const byPlayer = new Map();
  for (const [fpId, rec] of dropped) {
    let clearsAt = null;
    if (days != null) clearsAt = new Date(rec.at.getTime() + days * DAY_MS);
    if (w.processDay != null) {
      // Claims process on a fixed weekday; a player sits until the first
      // processing run at or after his claim period ends.
      const from = clearsAt || rec.at;
      const c = new Date(from);
      c.setHours(w.processHour ?? 3, 0, 0, 0);
      while (c.getDay() !== w.processDay || c < from) c.setDate(c.getDate() + 1);
      clearsAt = c;
    }
    if (!clearsAt) continue;
    byPlayer.set(fpId, {
      droppedAt: rec.at, droppedBy: rec.teamName, clearsAt,
      onWaivers: now < clearsAt,
      hoursLeft: Math.max(0, (clearsAt - now) / 3600000),
    });
  }
  return { configured:true, none:false, type, byPlayer };
}

/** "on waivers · clears Wed 3am" / "free agent". */
function waiverCell(clock, p){
  const td = el('td');
  if (!clock.configured) { td.append(el('span','note','—')); td.title='Set a claim period in League Setup to see this.'; return td; }
  if (clock.none) { td.append(el('span','pill ok','free agent')); return td; }
  const w = clock.byPlayer.get(p.i);
  if (!w || !w.onWaivers) { td.append(el('span','pill ok','free agent')); return td; }
  const box = el('div','mvside');
  box.append(el('span','pill q','on waivers'));
  const hrs = w.hoursLeft;
  const when = hrs < 24
    ? 'clears in ' + Math.round(hrs) + 'h'
    : 'clears ' + w.clearsAt.toLocaleDateString([], {weekday:'short'}) + ' ' +
      w.clearsAt.toLocaleTimeString([], {hour:'numeric'});
  box.append(Object.assign(el('div','ss'),{textContent:when}));
  td.append(box);
  td.title = 'Dropped ' + w.droppedAt.toLocaleString() + (w.droppedBy ? ' by ' + w.droppedBy : '') +
    '; claims process before he reaches free agency.';
  return td;
}

/* ---------- demand signal ----------
   Everything else in this dashboard answers "how many points". This answers
   "how long is the window open", which is the question a waiver claim actually
   turns on — and it is the only data here that moves by the hour. */

/** Adds per hour, abbreviated: 16428 -> 16.4k/h. */
function rate(v){
  if(v==null) return '—';
  if(v>=10000) return (v/1000).toFixed(0)+'k';
  if(v>=1000) return (v/1000).toFixed(1)+'k';
  return String(Math.round(v));
}

/**
 * The acceleration cell, which is the one number on this page worth acting on.
 *
 * Volume tells you a player has already been claimed; acceleration tells you he
 * is being claimed NOW. Michael Mayer at 380k adds and 0.33x is a wave that
 * broke hours ago and a claim you are late to; Devin Singletary at 100k and
 * 200x is the wave itself.
 */
function surgeCell(sig){
  const td=el('td','r');
  if(!sig){ td.append(el('span','delta flat','—')); return td; }
  if(sig.v==null){
    const sp=el('span','pill '+(sig.fresh?'ok':'gh'), sig.r!=null?'new':'—');
    sp.title = sig.fresh? 'No measurable activity before the last few hours — this is the start of the wave.' : 'Not enough history to measure a rate.';
    td.append(sp); return td;
  }
  const cls = sig.v>=2 ? 'up' : (sig.v<0.7 ? 'dn' : 'flat');
  const sp=el('span','delta '+cls, sig.v>=10? Math.round(sig.v)+'x' : sig.v.toFixed(1)+'x');
  sp.title = 'Adds per hour over the last '+(DATA.signals.windows?DATA.signals.windows[0]:6)+'h against the rate before it. '+
    (sig.v>=2? 'Accelerating — claim now.' : (sig.v<0.7? 'Decelerating — the wave has passed.' : 'Steady.'));
  td.append(sp); return td;
}

/** How much of the market already has him — the size of the window remaining. */
function rosteredCell(sig){
  const td=el('td','r');
  if(!sig || sig.yr==null){ td.append(el('span','delta flat','—')); return td; }
  const box=el('div'); box.style.display='flex'; box.style.alignItems='center'; box.style.gap='7px'; box.style.justifyContent='flex-end';
  box.append(Object.assign(el('span','num'),{textContent:sig.yr+'%'}));
  const bar=el('div','bar'); const i=el('i');
  i.style.width=Math.max(0,Math.min(100,sig.yr))+'%';
  if(sig.yrc!=null && sig.yrc>0) i.className='mk';
  bar.append(i); box.append(bar);
  td.append(box);
  td.title=sig.yr+'% of Yahoo leagues roster him'+(sig.yrc!=null?' ('+(sig.yrc>0?'+':'')+sig.yrc+' pts since the previous day)':'')+
    (sig.ys!=null?'; started in '+sig.ys+'%':'');
  return td;
}

/* ---------- players page ----------
   The full pool, browsed the way Sleeper's Players tab reads: every player
   FantasyPros ranks, or just the ones nobody in this league owns, with a
   projection column that switches between this week and rest of season.
   Filters compose — position, NFL team, league roster and the watch list all
   AND together, and the demand tile is back to being a per-row column rather
   than the whole page. */

/** The watch list: plain player ids in localStorage, toggled by the star. */
const watch = (()=>{
  const KEY='gd.watchlist';
  let set=new Set();
  try{ const v=localStorage.getItem(KEY); if(v) set=new Set(String(v).split(',').filter(Boolean)); }catch{}
  const persist=()=>{ try{ localStorage.setItem(KEY,[...set].join(',')); }catch{} };
  return {
    has: id => set.has(String(id)),
    toggle(id){ const s=String(id); if(set.has(s)) set.delete(s); else set.add(s); persist(); },
    all: ()=>[...set],
    count: ()=>set.size,
  };
})();

const GRADE_ORDER=['F','D-','D','D+','C-','C','C+','B-','B','B+','A-','A','A+'];

/**
 * The players table's sort table.
 *
 * Keys are the same names the column headers use, so clicking a header shows
 * the sort that made the row order. Projection sorts read the selected
 * look-ahead window rather than freezing week-1 or rest-of-season.
 */
const PLAYER_SORTS = {
  name:  {label:'Name', of:p=>String(p.n||'').toLowerCase(), text:true},
  roster:{label:'Roster', of:p=>(ROSTER.get(p.i)?.name||'~').toLowerCase(), text:true},
  proj:  {label:'Projection', of:p=> horizonValue(p,'fp',hz()).v??-1, dir:-1},
  rank:  {label:'Rank', of:p=> hzMode(hz())==='ros'? (p.rosRk??9999):(p.rk??9999), dir:1},
  pos:   {label:'Position', of:p=> POS_ORDER[p.p]||9, dir:1},
  grade: {label:'Grade', of:p=> GRADE_ORDER.indexOf(String(p.g||'')), dir:-1},
  surge: {label:'Surge', of:p=> p.sig?.v??(p.sig?.r!=null?0:-1), dir:-1},
  adds:  {label:'Adds/h', of:p=> p.sig?.r??-1, dir:-1},
  heat:  {label:'Heat', of:p=> p.sig?.h??-1, dir:-1},
  rostered:{label:'Rostered', of:p=> p.sig?.yr??-1, dir:-1},
};

function byPlayers(a,b){
  const s=PLAYER_SORTS[playerSort]||PLAYER_SORTS.proj;
  const d=(s.dir||1)*(playerFlip?-1:1);
  const x=s.of(a), y=s.of(b);
  if(x===y) return byPlayerFallback(a,b);
  if(s.text) return String(x).localeCompare(String(y))*d;
  return (x<y?-1:1)*d;
}
function byPlayerFallback(a,b){
  return (POS_ORDER[a.p]||9)-(POS_ORDER[b.p]||9)
    || String(a.n||'').localeCompare(String(b.n||''))
    || ((horizonValue(b,'fp',hz()).v??-1)-(horizonValue(a,'fp',hz()).v??-1));
}

/** The star that keeps a player on the watch list. */
function starBtn(p){
  const on=watch.has(String(p.i));
  const b=el('button','star'+(on?' on':''), on?'★':'☆');
  b.type='button'; b.title = on? 'Remove from watch list' : 'Add to watch list';
  b.setAttribute('aria-label',b.title);
  b.onclick=()=>{ watch.toggle(String(p.i)); buildList(); };
  return b;
}

/** Generic filter chip; click toggles it in/out of the set.
    `fullRender` chips (roster, free-agent) switch scope to All first, so a
    team chip can never be silently ignored by the scope toggle. */
function filterChip(label, active, onClick, decorate, fullRender){
  const b=el('button','fchip'+(active?' on':''), label);
  b.type='button'; b.setAttribute('aria-pressed',String(active));
  if(decorate) decorate(b);
  b.onclick=()=>{
    const next=onClick();
    b.classList.toggle('on',next); b.setAttribute('aria-pressed',String(next));
    if(fullRender) render(); else buildList();
  };
  return b;
}
function chipGroup(title, chips){
  const g=el('div','fgroup');
  g.append(el('span','ftitle',title));
  chips.forEach(c=>g.append(c));
  return g;
}

/** Position chips carry the Sleeper slot colour when active, like the cells do. */
function posChipFilter(pos){
  return filterChip(pos, playerPos.has(pos), ()=>{
    if(playerPos.has(pos)) playerPos.delete(pos); else playerPos.add(pos);
    store.set('gd.playerPos',[...playerPos].join(','));
    return playerPos.has(pos);
  }, b=>{
    b.setAttribute('data-p',pos);
    b.style.setProperty('--p','var('+(POS_VAR[pos]||'--p-flex')+')');
  });
}

/** NFL-team chips: logo + abbrev, filter the league-agnostic pool. */
function teamChipFilter(t){
  return filterChip('', playerTeams.has(t), ()=>{
    if(playerTeams.has(t)) playerTeams.delete(t); else playerTeams.add(t);
    store.set('gd.playerTeams',[...playerTeams].join(','));
    return playerTeams.has(t);
  }, b=>{ b.prepend(imgEl(teamLogo(t),'tml')); b.append(document.createTextNode(t)); });
}

/** League-roster chips: every team in the league, plus Free agents. */
function rosterChipFilter(t){
  const id=String(t.id);
  return filterChip('', playerRoster.has(id), ()=>{
    playerScope='all'; store.set('gd.playerScope', playerScope);
    if(playerRoster.has(id)) playerRoster.delete(id); else playerRoster.add(id);
    store.set('gd.playerRoster',[...playerRoster].join(','));
    return playerRoster.has(id);
  }, b=>{ b.prepend(imgEl(t.logo,'tml')); b.append(document.createTextNode(teamLabel(PLAYER_L,t))); }, true);
}
function faChipFilter(){
  return filterChip('Free agents', playerRoster.has('__FA__'), ()=>{
    playerScope='all'; store.set('gd.playerScope', playerScope);
    if(playerRoster.has('__FA__')) playerRoster.delete('__FA__'); else playerRoster.add('__FA__');
    store.set('gd.playerRoster',[...playerRoster].join(','));
    return playerRoster.has('__FA__');

/** "on waivers · clears Wed 3am" / "free agent" (from the waiver clock). */
function playerStatusCell(p){

}

/** The league team that rosters him, or a Free-agents badge. */
function leagueRosterCell(p){

/** The toggled projection, with the other scale beneath as the tie line. */
function projCell(p){
  const h=hz(), mode=hzMode(h);

function rankCell(p){

function oppCell(p){

}
function addsCell(p){
  const td=el('td','r num');
  td.textContent = p.sig?.r!=null? rate(p.sig.r) : '—';
  if(p.sig?.r!=null) td.title=Math.round(p.sig.r)+' adds per hour across Sleeper';
  return td;
}

/** The filtered pool, every rule ANDed. */
function playList(){
  let list=[...PLAYER_POOL];
  if(playerScope==='fa'){
    list=list.filter(p=> !ROSTER.has(p.i));
  } else if(playerRoster.size){
    const fa=playerRoster.has('__FA__');
    list=list.filter(p=>{
      const r=ROSTER.get(p.i);
      return r ? playerRoster.has(r.id) : fa;
    });
  }
  if(playerTeams.size) list=list.filter(p=> playerTeams.has(p.t));
  if(playerPos.size)   list=list.filter(p=> playerPos.has(p.p));
  if(playerWatchOnly)  list=list.filter(p=> watch.has(String(p.i)));
  if(playerQuery)      list=list.filter(p=> (p.n||'').toLowerCase().includes(playerQuery));
  list.sort(byPlayers);
  return list;
}

function onPlayerSort(key){
  if(playerSort===key) playerFlip=!playerFlip;
  else { playerSort=key; playerFlip=false; }
  store.set('gd.playerSort',playerSort); store.set('gd.playerFlip',playerFlip?'1':'');
  buildList();
}

function playerRow(p){
  const tr=el('tr');
  const sc=el('td','watch'); sc.append(starBtn(p)); tr.append(sc);
  tr.append(playerCell2(p));
  tr.append(leagueRosterCell(p));
  if(hzMode(hz())!=='ros') tr.append(oppCell(p));
  tr.append(projCell(p));
  tr.append(rankCell(p));
  tr.append(gradeCell(p));
  tr.append(surgeCell(p.sig));
  tr.append(addsCell(p));
  tr.append(rosteredCell(p.sig));
  tr.append(playerStatusCell(p));
  return tr;
}

function playersTable(list){
  const wrap=el('div','scroll');
  const t=el('table','fixed');
  const cg=el('colgroup');
  const widths=[34,240,150, hzMode(hz())!=='ros'?120:0, PROJW, 48, 56, 62, 62, 108, 110].filter(w=>w);
  widths.forEach(w=>{ const co=el('col'); co.style.width=w+'px'; cg.append(co); });
  t.append(cg);
  const cols=[
    {key:null, label:''},
    {key:'name', label:'Player'},
    {key:'roster', label:'Roster'},
    ...(hzMode(hz())!=='ros' ? [{key:'opp', label:'Opp'}] : []),
    {key:'proj', label: labelHz(hz()), r:1, sep:1, title:'Projection for the selected window'},
    {key:'rank', label:'Rk', r:1, title:'Overall consensus rank for the shown scale'},
    {key:'grade', label:'Grade', r:1},
    {key:'surge', label:'Surge', r:1},
    {key:'adds', label:'Adds/h', r:1},
    {key:'rostered', label:'Rostered', r:1},
    {key:'status', label:'Status'},
  ];
  const thead=el('thead'); const hr=el('tr');
  cols.forEach(c=> hr.append( c.key? sortTh(c, playerSort, playerFlip, onPlayerSort) : el('th')));
  thead.append(hr); t.append(thead);
  const tb=el('tbody'); list.forEach(p=>tb.append(playerRow(p))); t.append(tb);
  wrap.append(t); return wrap;
}

/** Rebuild only the list panel, so a search keeps its focus while typing. */
function buildList(){
  if(!LIST) return;
  while(LIST.firstChild) LIST.removeChild(LIST.firstChild);
  const list=playList();
  const header=el('header');
  header.append(el('h3',null,'Players'));
  header.append(el('div','spacer'));
  if(watch.count()) header.append(el('span','pcount','★ '+watch.count()+' watched'));
  header.append(el('span','pcount total', list.length+' players'));
  LIST.append(header);
  if(!list.length){
    LIST.append(el('div','pbody', emptyState('No players match','Loosen a filter, or clear the search.')));
    return;
  }
  const body=el('div'); body.append(playersTable(list)); LIST.append(body);
}

function pagePlayers(){
  const l=L(), out=[];

  h.append(el('h1',null,'Players'));

  if(!PLAYER_POOL.length){ out.push(panel('Players', null, emptyState('No player pool','Run `npm run fp:sync`, then rebuild the dashboard.'))); return out; }

  PLAYER_L=l;
  ROSTER=new Map();

  }));

  line.append(horizonSelect());

  const wb=el('button','iconbtn'+(playerWatchOnly?' watchon':''),'★ Watch list'); wb.type='button';
  wb.setAttribute('aria-pressed',String(playerWatchOnly));
  wb.title='Only show watched players';
  wb.onclick=()=>{ playerWatchOnly=!playerWatchOnly; store.set('gd.playerWatchOnly',playerWatchOnly?'1':''); render(); };

function pageEdge(){
  const l=L(), out=[];
  const h=el('div','head'); h.append(el('h1',null,'Market Edge'));
  h.append(el('p',null,'Where the sportsbook ('+DATA.bookmaker+') disagrees with the FantasyPros consensus, across every roster in '+l.name+'. Only fully-priced players are compared — a partial market produces a fake gap.'));
  out.push(h);

  let list=[...seen.values()];
  if(!list.length){ out.push(panel('Edge',null,emptyState('No comparison available','Run vegas:sync, then enrich.'))); return out; }
  list.sort((a,b)=> Math.abs(b.p.vd)-Math.abs(a.p.vd));
  const over=list.filter(x=>x.p.vd>0).length;
  const strip=el('div','strip');
  strip.append(statTile('Compared', String(list.length),'fully-priced players'));
  strip.append(statTile('Vegas higher', String(over),'market above consensus','market'));
  strip.append(statTile('Vegas lower', String(list.length-over),'market below consensus','consensus'));
  out.push(strip);
  const rows=list.slice(0,50).map(({p,team})=>{

    return tr;
  });

    table([{label:'Player'},{label:'Roster'},{label:'FP',r:1},{label:'Vegas',r:1},{label:'Δ',r:1},{label:'Volatility'}], rows)));
  return out;
}

/**
 * Transactions as the manager made them.
 *
 * One row is one MOVE, not one player: the add and the drop that paid for it
 * sit side by side, and a trade shows both sides. Split apart they read as
 * unrelated events — "who did they drop for him" is most of what a transaction
 * log is for, and it was the part being thrown away.
 */
const KIND = {
  add:   {label:'Add',   cls:'ok'},
  drop:  {label:'Drop',  cls:'gh'},
  swap:  {label:'Add/Drop', cls:'q'},
  trade: {label:'Trade', cls:'q'},
  other: {label:'Move',  cls:'gh'},
};
function kindPill(t){
  const k=KIND[t.kind]||KIND.other;
  const sp=el('span','pill '+k.cls, k.label);
  if(t.viaWaivers) sp.title='Came off waivers';
  return sp;
}

/** A stack of player chips for one side of a move. */
function movePlayers(items, sign){
  const w=el('div','mvside');
  if(!items.length){ w.append(el('span','note','—')); return w; }
  items.forEach(i=>{
    const row=el('div','mvp');
    row.append(el('span','mvsign'+(sign>0?' add':' drop'), sign>0?'+':'\u2212'));
    if(i.playerTeam) row.append(imgEl(teamLogo(i.playerTeam),'tmlogo'));
    row.append(el('span','mvn', i.playerName||('fpId '+i.fpId)));
    if(i.playerPos) row.append(posChip(i.playerPos,'mini'));
    w.append(row);
  });
  return w;
}

function pageMoves(){
  const l=L(), out=[];
  const h=el('div','head'); h.append(el('h1',null,'Transactions'));
  h.append(el('p',null,'Every move in '+l.name+', kept whole \u2014 an add and the drop that paid for it are one row, as they were one action.'));

/**
 * How old every number on this site actually is.
 *
 * Two clocks, and conflating them is the mistake: "fetched" is when we pulled
 * it, "site said" is when the source itself last recomputed. A source can be
 * fetched a minute ago and be publishing yesterday's numbers, and without both
 * columns there is no way to tell that from a source that genuinely just moved.
 * Where a site publishes no recompute time, the column is honestly blank rather
 * than echoing our own clock back.
 */
function freshnessPanel(){
  const rows=(DATA.freshness||[]).map(f=>{
    const tr=el('tr'); if(f.stale) tr.className='benchrow';
    tr.append(Object.assign(el('td'),{textContent:SOURCE_LABEL[f.source]||f.source}));
    const a=el('td','r');
    a.append(el('span','delta '+(f.stale?'dn':'up'), f.age));
    a.title=f.fetchedAt? new Date(f.fetchedAt).toLocaleString() : '';
    tr.append(a);
    const sa=el('td','r');
    if(f.sourceAge){ sa.append(el('span','num',f.sourceAge)); sa.title='The site\u2019s own last-recomputed time: '+new Date(f.sourceAt).toLocaleString(); }
    else { sa.append(el('span','note','—')); sa.title='This source publishes no update time; age is ours alone.'; }
    tr.append(sa);
    tr.append(Object.assign(el('td','r num'),{textContent:f.items==null?'—':String(f.items)}));
    const st=el('td');
    if(f.failed) st.append(el('span','pill out',f.failed+' failed'));
    else st.append(el('span','pill '+(f.stale?'q':'ok'), f.stale?'stale':'fresh'));
    tr.append(st);
    return tr;
  });
  if(!rows.length){
    return panel('Data freshness', null, emptyState('No sync recorded yet','Run `npm run sync` to populate the ledger.'));
  }
  const stale=(DATA.freshness||[]).filter(f=>f.stale).length;
  return panel('Data freshness', stale? stale+' source(s) past their refresh window \u2014 `npm run sync`' : 'everything current',
    table([{label:'Source'},{label:'Fetched',r:1},{label:'Site said',r:1},{label:'Rows',r:1},{label:''}], rows));
}

function field(label, control, hint){
  const d=el('div','fld');
  d.append(el('label','lbl',label));
  d.append(control);
  if(hint) d.append(el('div','fhint',hint));

function textInput(value, onCommit, placeholder){
  const i=el('input'); i.type='text'; i.value=value??''; if(placeholder) i.placeholder=placeholder;
  // Commit on blur and on Enter, not on every keystroke: a re-render per
  // character would take the focus out of the field being typed into.
  const commit=()=>{ const v=i.value.trim(); onCommit(v===''? null : v); };
  i.addEventListener('blur',commit);
  i.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); i.blur(); } });
  return i;
}
function numInput(value, onCommit, {min,max,placeholder}={}){
  const i=el('input'); i.type='number'; i.value=value??''; i.style.maxWidth='90px';
  if(min!=null) i.min=min; if(max!=null) i.max=max; if(placeholder) i.placeholder=placeholder;
  const commit=()=>{ const v=i.value.trim(); onCommit(v===''? null : Number(v)); };
  i.addEventListener('blur',commit);
  i.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); i.blur(); } });
  return i;
}
function selectInput(options, value, onPick){
  const sel=el('select');
  options.forEach(o=>{ const op=el('option',null,o.label); op.value=o.value==null?'':o.value; sel.append(op); });
  sel.value = value==null? '' : String(value);
  sel.onchange=()=> onPick(sel.value===''? null : sel.value);
  return sel;
}

/**
 * The league's scoring table, and the corrections to it.
 *
 * Two sources disagree here, and both are shown rather than merged silently:
 *
 *   scraped  MyPlaybook's reading of the league's rules. Available for ESPN,
 *            Yahoo and Sleeper, and complete for none of them — its Sleeper
 *            reading carries no defensive stats for a league that scores them.
 *   host     the host's own table, where the host publishes one. Sleeper does;
 *            ESPN and Yahoo do not expose one reachable from here.
 *
 * You edit the third column, which wins over both. Nothing here changes the
 * points on the rest of the page — those come from the host itself, per player,
 * off the live board — so this is the reference that explains WHY a number
 * differs from a generic PPR projection, and the place to record a rule the
 * scrape got wrong.
 */
const SLEEPER_STAT = {
  'PassYds':'pass_yd', 'PassTD':'pass_td', 'IntQB':'pass_int', 'Pass2pt':'pass_2pt',
  'RushYds':'rush_yd', 'RushTD':'rush_td', 'Rush2pt':'rush_2pt',
  'RecYds':'rec_yd', 'RecTD':'rec_td', 'Rec':'rec', 'RecWR':'rec', 'RecRB':'rec', 'RecTE':'rec',
  'FumLost':'fum_lost', 'FumRec':'fum_rec', '2-PT':'pass_2pt',
  'PAT':'xpm', 'IntDef':'int', 'Sack':'sck', 'Safety':'safe', 'DefTD':'def_td',
};
const STAT_LABEL = {
  'PassYds':'Passing yards', 'PassTD':'Passing TD', 'IntQB':'Interception thrown',
  'RushYds':'Rushing yards', 'RushTD':'Rushing TD',
  'RecYds':'Receiving yards', 'RecTD':'Receiving TD',
  'Rec':'Reception', 'RecWR':'Reception — WR', 'RecRB':'Reception — RB', 'RecTE':'Reception — TE',
  'FumLost':'Fumble lost', 'FumRec':'Fumble recovered', '2-PT':'Two-point conversion',
  'FG':'Field goal', 'PAT':'Extra point', 'IntDef':'Interception (D)', 'Sack':'Sack',
  'Safety':'Safety', 'DefTD':'Defensive TD', 'PtsAllow':'Points allowed',
};

function scoringPanel(l, o){
  const sys=l.scoringSystem;
  const host=(l.detail && l.detail.supported && l.detail.settings) ? l.detail.settings.scoring : null;
  const over=o.scoring||{};
  if(!sys && !host){
    return panel('Scoring', l.host,
      emptyState('No scoring table from this host', 'Per-player points still come from the host itself, so they are correct — there is just nothing here to show or correct.'));
  }

  const rules=(sys&&sys.rules)||[];
  const seen=new Set(rules.map(r=>r.stat));
  // A stat the host publishes and the scrape missed is exactly the gap this
  // panel exists for, so it gets a row of its own rather than being dropped.
  const extra=[];
  if(host){
    Object.entries(SLEEPER_STAT).forEach(([stat,key])=>{
      if(seen.has(stat) || host[key]==null) return;
      if(extra.some(e=>e.stat===stat)) return;
      extra.push({stat, tiers:[], missing:true});
    });
  }

  const rowFor=(r)=>{
    const tr=el('tr');
    if(r.missing) tr.classList.add('benchrow');

    const nc=el('td');
    const w=el('div','nm');
    w.append(el('b',null, STAT_LABEL[r.stat] || r.stat));
    w.append(el('small',null, r.stat + (r.tiers.length>1? ' · '+r.tiers.length+' bands' : '')));
    nc.append(w); tr.append(nc);

    // Banded stats (FG by distance, PtsAllow by bracket) are a table, not a
    // number, so they are shown whole and left uneditable rather than flattened
    // to whichever band happened to come first.
    const sc=el('td','r');
    if(r.tiers.length>1){
      sc.append(Object.assign(el('div','ss'),{textContent:r.tiers.map(t=>t.points+' @ '+t.lower+'–'+t.upper).join('  ·  ')}));
    } else if(r.tiers.length===1){
      sc.append(Object.assign(el('div','num'),{textContent:String(r.tiers[0].points)}));
    } else sc.append(el('span','note','—'));
    tr.append(sc);

    const hc=el('td','r');
    const hv=host? host[SLEEPER_STAT[r.stat]] : undefined;
    if(hv==null) hc.append(el('span','note', host? '—' : ''));
    else{
      const sp=el('span','num', String(hv));
      // A disagreement is the whole reason both columns are here.
      if(r.tiers.length===1 && Number(hv)!==Number(r.tiers[0].points)) sp.style.color='var(--warn)';
      hc.append(sp);
    }
    tr.append(hc);

    const oc=el('td','r');
    if(r.tiers.length>1) oc.append(el('span','note','banded'));
    else oc.append(numInput(over[r.stat], v=>{
      const next={...over}; if(v==null) delete next[r.stat]; else next[r.stat]=v;
      edits.set(l.key,{scoring:next}); render();
    }, {placeholder: r.tiers[0]? String(r.tiers[0].points) : (hv!=null? String(hv) : '')}));
    tr.append(oc);
    return tr;
  };

  const all=[...rules, ...extra].sort((a,b)=>String(a.stat).localeCompare(String(b.stat)));
  const body=table(
    [{label:'Stat'},{label:'MyPlaybook',r:1},{label:l.host+' direct',r:1},{label:'Yours',r:1}],
    all.map(rowFor));

  const notes=[];
  if(sys) notes.push('Format: '+(sys.format||'—')+(sys.custom? ' · custom scoring on' : ''));
  if(extra.length) notes.push(extra.length+' stat(s) the '+l.host+' table has and the MyPlaybook read does not.');
  notes.push('Per-player points elsewhere in this app come from the host’s own scoring, not from this table — this is the reference, and the place to record what the scrape got wrong.');
  const wrap=el('div');
  wrap.append(body);
  const nb=el('div','pbody');
  notes.forEach(n=> nb.append(Object.assign(el('p','note'),{textContent:n})));
  wrap.append(nb);
  return panel('Scoring', sys? (sys.basic||sys.format||null) : l.host, wrap);
}

    return tr;
  });
  out.push(panel('Teams', mineIds.size+' marked yours'+(mineIds.size>1? ' · ★ is the one My Team opens on':''),
    table([{label:'Id',r:1},{label:'Nickname'},{label:'Mine'},{label:'Primary'},{label:'Division'},{label:'Players',r:1}], teamRows)));

  /* --- playoffs ------------------------------------------------------- */
  const pf=o.playoffs||{};
  const pb=el('div','pbody');
  const pg=el('div','fgrid');
  pg.append(field('Seeding rule',
    selectInput([{value:null,label:'— not set —'}, ...Object.entries(DATA.rules.seed).map(([k,v])=>({value:k,label:v}))],
      pf.rule, v=>{ edits.set(l.key,{playoffs:{rule:v}}); render(); }),
    'How seeds are actually decided. No host exposes this.'));
  pg.append(field('Playoff teams',
    numInput(pf.playoffTeams ?? (l.playoffs&&l.playoffs.teams), v=>{ edits.set(l.key,{playoffs:{playoffTeams:v}}); render(); }, {min:2,max:16}),
    l.playoffs&&l.playoffs.teams? 'Host says '+l.playoffs.teams+'.' : null));
  if(pf.rule==='division-first'){
    pg.append(field('Division seeds locked',
      numInput(pf.divisionSeeds ?? 2, v=>{ edits.set(l.key,{playoffs:{divisionSeeds:v}}); render(); }, {min:1,max:8}),
      'Top N seeds reserved for division winners.'));
  }
  if(pf.rule==='points-wildcard'){
    pg.append(field('Points wildcards',
      numInput(pf.wildcards ?? 1, v=>{ edits.set(l.key,{playoffs:{wildcards:v}}); render(); }, {min:1,max:4}),
      'Final N seeds go to the highest points-for among teams that missed on record.'));
  }
  pg.append(field('Tiebreaker',
    selectInput([{value:null,label:'Points for (default)'}, ...Object.entries(DATA.rules.tiebreak).map(([k,v])=>({value:k,label:v}))],
      pf.tiebreak, v=>{ edits.set(l.key,{playoffs:{tiebreak:v}}); render(); })));
  pg.append(field('Playoffs start week',
    numInput(pf.startWeek ?? (l.playoffs&&l.playoffs.startWeek), v=>{ edits.set(l.key,{playoffs:{startWeek:v}}); render(); }, {min:10,max:18})));
  pg.append(field('Note', textInput(pf.note, v=>{ edits.set(l.key,{playoffs:{note:v}}); render(); }, 'e.g. seed 6 is most points among 6–12'),
    'Free text, for the rule your league actually wrote down.'));
  pb.append(pg);
  if(pf.rule){
    const d=el('p','note'); d.style.marginTop='10px';
    d.textContent='→ '+describeSeedRule(pf);
    pb.append(d);
  }
  out.push(panel('Playoffs', pf.rule? null : 'not configured — Standings will not show a bracket', pb));

  /* --- waivers -------------------------------------------------------- */
  const wv=o.waivers||{};
  const wb=el('div','pbody');
  const wg=el('div','fgrid');
  wg.append(field('Waiver type',
    selectInput([{value:null,label:l.waiverType? 'Host: '+l.waiverType : '— not set —'},
      {value:'rolling',label:'Rolling list'},{value:'faab',label:'FAAB'},{value:'reverse',label:'Reverse standings'},{value:'none',label:'No waivers'}],
      wv.type, v=>{ edits.set(l.key,{waivers:{type:v}}); render(); })));
  wg.append(field('Claim period (days)',
    numInput(wv.claimDays, v=>{ edits.set(l.key,{waivers:{claimDays:v}}); render(); }, {min:0,max:7,placeholder:'2'}),
    'How long a dropped player sits before clearing to free agency.'));
  wg.append(field('Claims process on',
    selectInput([{value:null,label:'—'},...['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].map((d,i)=>({value:i,label:d}))],
      wv.processDay, v=>{ edits.set(l.key,{waivers:{processDay: v==null?null:Number(v)}}); render(); }),
    'Used to say when a player clears.'));
  wg.append(field('at hour',
    numInput(wv.processHour, v=>{ edits.set(l.key,{waivers:{processHour:v}}); render(); }, {min:0,max:23,placeholder:'3'}),
    '24h, your local time.'));
  wb.append(wg);
  if(wv.processDay!=null){
    const d=el('p','note'); d.style.marginTop='10px';
    d.textContent='→ '+describeWaivers(wv);
    wb.append(d);
  }
  out.push(panel('Waivers', null, wb));

  /* --- scoring -------------------------------------------------------- */
  out.push(scoringPanel(l, o));
  return out;
}

/** Plain-English restatement of the configured seeding rule. */
function describeSeedRule(c){
  const tb=(DATA.rules.tiebreak[c.tiebreak]||'Points for').toLowerCase();
  const n=c.playoffTeams ?? '?';
  if(c.rule==='record') return 'Seeds 1–'+n+' by record, ties broken by '+tb+'.';
  if(c.rule==='division-first') return 'Top '+(c.divisionSeeds ?? 2)+' seeds are division winners; the rest by record, ties broken by '+tb+'.';
  if(c.rule==='points-wildcard') return 'Seeds 1–'+(Number(n)-(c.wildcards ?? 1))+' by record; the final '+(c.wildcards ?? 1)+' by most points for among everyone who missed.';
  return '';
}
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function describeWaivers(w){
  const hr=w.processHour!=null? ' at '+(w.processHour%12||12)+(w.processHour<12?'am':'pm') : '';
  return 'Claims process '+DAYS[w.processDay]+hr+(w.claimDays!=null? '; dropped players sit '+w.claimDays+' day(s) before clearing.' : '.');
}

/**
 * Write the local edits out as the file `league:import` reads.
 *
 * A download is the only way off a page with no server. Anchor downloads are
 * blocked in some embedded viewers, so the JSON is also dropped into a
 * selectable box — a copy-paste always works.
 */
function exportEdits(){
  const body={ exportedAt:new Date().toISOString(), leagues: edits.all() };
  const json=JSON.stringify(body,null,2);
  const n=Object.keys(body.leagues).length;
  if(!n){ alert('No local edits to export.'); return; }
  try{
    const url=URL.createObjectURL(new Blob([json],{type:'application/json'}));
    const a=el('a'); a.href=url; a.download='league-overrides.patch.json';
    document.body.append(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch{ /* download blocked; the box below still works */ }
  const dlg=el('div','exportbox');
  dlg.append(el('h3',null,'Edits for '+n+' league(s)'));
  dlg.append(Object.assign(el('p','note'),{textContent:'Save as league-overrides.patch.json, then: node src/cli.js league:import league-overrides.patch.json'}));
  const ta=el('textarea'); ta.value=json; ta.readOnly=true; ta.rows=14;
  dlg.append(ta);
  const close=el('button','iconbtn','Close'); close.type='button'; close.onclick=()=>dlg.remove();
  dlg.append(close);
  $('#page').prepend(dlg);
  ta.focus(); ta.select();
}

const RENDER={leagues:pageLeagues,manage:pageManage,overview:pageOverview,myteam:pageMyTeam,weeks:pageWeeks,matchup:pageMatchup,standings:pageStandings,players:pagePlayers,edge:pageEdge,moves:pageMoves,league:pageLeague};

function render(){
  const host=$('#page');
  host.innerHTML='';
  const nodes=(RENDER[page]||pageOverview)();
  nodes.forEach(n=> host.append(n));
  window.scrollTo({top:0});
}
addEventListener('hashchange',()=>{
  const h=readHash();
  if(h.league){ const m=leagues.find(l=>l.key===h.league); if(m) current=m; }
  const hp = h.page==='waivers' ? 'players' : h.page;
  if(hp && PAGES.some(p=>p.id===hp)) page=hp;
  if(h.hz) horizonKey=parseHz(h.hz).key;
  renderChrome(); render();
});
writeHash();
renderChrome();
render();
})();
</script>
